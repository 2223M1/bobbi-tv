<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>波比 TV · 片库整理</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#10151d;color:#edf2f8}body{max-width:900px;margin:auto;padding:20px}h1{font-size:1.5rem}h2{font-size:1.15rem}p{color:#aebfd2}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #41516a;background:#1a2534;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#235b77}nav,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.card{background:#18202d;padding:16px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}.card label{display:block;margin:8px 0}.card input,.card select{box-sizing:border-box;max-width:100%;width:100%}.muted{font-size:.88rem;color:#aebfd2}#status{padding:12px;background:#213047;border-radius:8px;white-space:pre-wrap}.error{color:#ffc4ba}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;color:#aebfd2}a{color:#8bd3fa}
.card input[type=checkbox]{width:auto;margin-left:8px}summary{cursor:pointer}#planStatus{white-space:pre-wrap;color:#d6e7f7}
</style><script src="/manage.js" defer></script></head>
<body><h1>波比 TV · 片库整理</h1><p>只修改本地作品描述，不更改云端文件、观看进度或播放。关闭电视上的二维码窗口即撤销手机授权。</p>
<div id="status" role="status">正在连接当前电视授权…</div>
<main id="workspace" class="hidden">
<nav><button id="itemsTab">作品整理</button><button id="sourcesTab">目录来源</button><button id="jobsTab">后台任务</button><button id="historyTab">继续观看摘要</button><button id="refresh">刷新</button><button id="revoke">结束授权</button></nav>
<div id="filters" class="row"><select id="state" aria-label="整理状态"><option value="">全部状态</option><option value="unmatched">待匹配</option><option value="ambiguous">身份不明确</option><option value="proposed">待确认建议</option><option value="confirmed">人工确认</option><option value="ignored">已忽略</option></select><button id="clearSource">查看全部来源</button></div>
<section id="rows" aria-live="polite"></section><div class="row"><button id="previous">上一页</button><button id="next">下一页</button></div>
<section id="groupRows"></section>
<section id="batch" class="card"><h2>待提交修改（每轮最多 100 项，每批最多 5 项）</h2><p class="muted">先逐项预览，再确认分批提交。版本冲突不会自动覆盖。断网不代表未保存，请核对原提交；结束授权不会撤回已发修改。当前页面保留最近 20 批回执。</p><div id="queue"></div><div id="planStatus" role="status"></div><div class="row"><button id="preview">预览全部修改</button><button id="apply" class="primary" disabled>确认 / 继续分批提交</button><button id="clear">清空本轮编辑</button><button id="cancelPlan" disabled>停止后续批次</button><button id="retry" disabled>核对原提交</button><button id="reviewAgain" disabled>读取当前修订重新核对</button></div><div id="previewRows"><div id="batchPreview"></div><div id="receipts" aria-live="polite"></div></div></section>
</main><p class="muted">无效、过期或账号变更时，请在电视重新打开“手机详细管理”并扫码。此页不提供远程播放。</p>
</body></html>
