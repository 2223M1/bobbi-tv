name: Verify public sources
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: python tools/build_release.py --output dist/repository-check
      - name: Verify checked-in packages are reproducible
        run: python tools/check_repository.py repository dist/repository-check
