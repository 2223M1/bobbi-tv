name: Verify private sources
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      # The inherited Kodi mock harness is intentionally a separate process.
      - run: python -m pytest -q tests --ignore=tests/private_baseline --ignore=tests/preparation_regression
      - run: python -m pytest -q tests/private_baseline
      - run: python -m pytest -q tests/preparation_regression
      - run: python tools/build_release.py --output dist/repository-check
      - name: Verify a second private build is byte-identical
        run: |
          python tools/build_release.py --output dist/repository-second
          python tools/check_repository.py dist/repository-check dist/repository-second
