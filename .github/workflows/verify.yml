name: Verify sources
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record actual checked-out commit (PR merge versus branch head)
        env:
          VERIFY_EVENT: ${{ github.event_name }}
          VERIFY_REF: ${{ github.ref }}
        run: |
          printf 'event=%s ref=%s\n' "$VERIFY_EVENT" "$VERIFY_REF"
          git show -s --format='commit=%H%ntree=%T%nparents=%P'
      - run: python -m pip install -r requirements-test.txt
      - name: Check diagnostic receiver with SQLite
        run: node --test infra/diagnostics/intake.test.mjs
      - name: Verify pinned third-party notices offline (not distribution clearance)
        run: python tools/vendor_licenses.py
      - name: Check generated Home rails without rewriting sources
        run: python tools/generate_home_rails.py --check
      # The inherited Kodi mock harness is intentionally a separate process.
      - name: Primary tests
        run: python -m pytest -q -rs tests --ignore=tests/private_baseline --ignore=tests/preparation_regression --junitxml=test-results/ci-primary.xml
      - name: Isolated inherited Kodi harness
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs tests/private_baseline --junitxml=test-results/ci-baseline.xml
      - name: Isolated preparation regression
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs tests/preparation_regression --junitxml=test-results/ci-preparation.xml
      - name: Native Android component packaging contracts
        if: ${{ !cancelled() }}
        run: python -m pytest -q native/tests/test_stage_components.py native/tests/test_repackage_android.py native/tests/test_android_native_proof.py native/tests/test_ci_gate.py --junitxml=test-results/ci-android-packaging.xml
      - name: Source-only component build (no application key or signing secrets)
        if: ${{ !cancelled() }}
        run: python tools/build_release.py --source-check --output dist/repository-check
      - name: Verify reproducible builds
        if: ${{ !cancelled() }}
        run: |
          python tools/build_release.py --source-check --output dist/repository-second
          python tools/check_repository.py dist/repository-check dist/repository-second
      - name: Preserve test receipts (not installable packages)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.event_name }}-${{ github.run_id }}
          path: test-results/ci-*.xml
          if-no-files-found: warn
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clean canonical patch application and production C++ semantic gates
        run: python native/tests/run_ci_gate.py --output test-results/native
      - name: Record platform certification boundary
        if: ${{ always() }}
        run: echo 'Android link/device NOT_TESTED here; APK signing requires its separate current clean-link proof.'
      - name: Preserve native success and failure receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-contracts-${{ github.event_name }}-${{ github.run_id }}
          path: |
            test-results/native/native-ci-*/gate-result.json
            test-results/native/native-ci-*/*.log
            test-results/native/native-ci-*/generic/generic-*/result.json
            test-results/native/native-ci-*/negative/completion-gate-*/result.json
            test-results/native/native-ci-*/negative/completion-gate-*/*/results/generic-*/result.json
          if-no-files-found: error
