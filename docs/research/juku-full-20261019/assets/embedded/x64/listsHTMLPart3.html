    <script>
        let categoriesData = [];
        let currentActiveCategorySlug = "";
        let playlistsBySlug = {};

        // Show Toast Function
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.toggle('toast-error', isError);
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Fetch Categories & Playlists (Level 1)
        async function loadCategories() {
            const grid = document.getElementById('playlistsGrid');
            const tabs = document.getElementById('playlistCategoryTabs');
            
            grid.innerHTML = '<div class="spinner-large"><\/div>';
            
            try {
                const response = await fetch('/api/mv/lists/categories');
                if (!response.ok) throw new Error("HTTP " + response.status);
                const raw = await response.json();
                
                categoriesData = raw.data || [];
                
                if (categoriesData.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:40px 0;text-align:center;">暂无精选片单分类<\/div>';
                    return;
                }

                // Render tabs
                let tabsHTML = "";
                playlistsBySlug = {};
                
                categoriesData.forEach((cat, idx) => {
                    const slug = cat.slug || ("cat-" + idx);
                    playlistsBySlug[slug] = cat.playlists || [];
                    const isActive = idx === 0;
                    if (isActive) {
                        currentActiveCategorySlug = slug;
                    }
                    tabsHTML += '<button class="category-tab' + (isActive ? ' active' : '') + '" data-slug="' + slug + '" onclick="switchPlaylistCategory(\'' + slug + '\')">' + cat.name + '<\/button>';
                });
                
                tabs.innerHTML = tabsHTML;
                renderPlaylistsGrid(currentActiveCategorySlug);

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div style="color:var(--color-expired);font-size:12px;padding:40px 0;text-align:center;">加载片单分类失败: ' + err.message + '<\/div>';
            }
        }

        // Render playlists under active category
        function renderPlaylistsGrid(slug) {
            const grid = document.getElementById('playlistsGrid');
            const playlists = playlistsBySlug[slug] || [];
            
            if (playlists.length === 0) {
                grid.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:40px 0;text-align:center;">该分类下暂无主题片单<\/div>';
                return;
            }

            let html = "";
            playlists.forEach(pl => {
                const countLabel = pl.itemCount !== undefined ? pl.itemCount : pl.item_count;
                const cover = pl.coverUrl || pl.cover_url || "";
                
                // Safe values for onclick string
                const safeTitle = pl.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeDesc = (pl.description || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                html += 
                    '<div class="playlist-card" onclick="openPlaylist(\'' + pl.slug + '\', \'' + safeTitle + '\', \'' + safeDesc + '\')">' +
                        '<div class="playlist-cover-wrap">' +
                            '<img class="playlist-cover" referrerpolicy="no-referrer" src="' + getAbsoluteCoverUrl(cover) + '" alt="' + pl.title + '" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 font-size=%2212%22 text-anchor=%22middle%22>📚</text></svg>\'">' +
                        '<\/div>' +
                        '<div class="playlist-info">' +
                            '<div class="playlist-title">' + pl.title + '<\/div>' +
                            '<div class="playlist-count">共 ' + countLabel + ' 部影片<\/div>' +
                        '<\/div>' +
                    '<\/div>';
            });
            grid.innerHTML = html;
        }

        // Switch category tabs
        function switchPlaylistCategory(slug) {
            currentActiveCategorySlug = slug;
            const buttons = document.querySelectorAll('.category-tab');
            buttons.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-slug') === slug);
            });
            renderPlaylistsGrid(slug);
        }

        function renderStars(score) {
            const scoreVal = parseFloat(score);
            if (isNaN(scoreVal) || scoreVal <= 0) return '';
            const stars = (scoreVal / 2).toFixed(1);
            const fullStars = Math.floor(stars);
            const hasHalf = (stars - fullStars) >= 0.3 && (stars - fullStars) <= 0.7;
            const extraFull = (stars - fullStars) > 0.7 ? 1 : 0;
            
            let starsHTML = '<div class="star-rating">';
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars + extraFull) {
                    starsHTML += '<span class="star-icon active">★<\/span>';
                } else if (i === fullStars + 1 && hasHalf) {
                    starsHTML += '<span class="star-icon half">★<\/span>';
                } else {
                    starsHTML += '<span class="star-icon">★<\/span>';
                }
            }
            starsHTML += '<\/div>';
            return starsHTML;
        }

        // Open specific playlist and list its videos (Level 2)
        async function openPlaylist(slug, title, desc) {
            const playlistsView = document.getElementById('playlistsView');
            const playlistDetailView = document.getElementById('playlistDetailView');
            
            const titleEl = document.getElementById('currentPlaylistTitle');
            const descBox = document.getElementById('currentPlaylistDescBox');
            const descText = document.getElementById('currentPlaylistDesc');
            const videosGrid = document.getElementById('playlistVideosGrid');
            
            titleEl.innerText = title;
            
            if (desc) {
                descText.innerText = desc;
                descBox.style.display = 'block';
            } else {
                descBox.style.display = 'none';
            }
            
            videosGrid.innerHTML = '<div class="spinner-large"><\/div><div style="text-align:center;color:var(--text-muted);font-size:12px;">正在调取片单内的影视资源...<\/div>';
            
            playlistsView.style.display = 'none';
            playlistDetailView.style.display = 'block';

            try {
                // Fetch playlist details
                const response = await fetch('/api/mv/lists/' + encodeURIComponent(slug));
                if (!response.ok) throw new Error("HTTP " + response.status);
                const raw = await response.json();
                
                const dataObj = raw.data || {};
                const playlistMeta = dataObj.playlist || {};
                const items = dataObj.items || [];
                
                // Update description if fetched dynamically
                if (playlistMeta.description) {
                    descText.innerText = playlistMeta.description;
                    descBox.style.display = 'block';
                }
                
                if (items.length === 0) {
                    videosGrid.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:40px 0;text-align:center;">片单内暂无影视内容<\/div>';
                    return;
                }

                // Render video grid
                let gridHTML = "";
                items.forEach(v => {
                    const trueId = v.vodInfoId || v.id;
                    const cover = v.coverUrl || v.cover_url || "";
                    const year = v.year || "未知";
                    
                    let tagsHTML = "";
                    if (v.tags && v.tags.length > 0) {
                        let count = 0;
                        for (let t of v.tags) {
                            if (isNaN(t) && t !== "中国大陆" && t !== "美国" && t !== "香港" && t !== "日本") {
                                tagsHTML += '<span class="playlist-video-tag">' + t + '<\/span>';
                                count++;
                                if (count >= 3) break;
                            }
                        }
                    }

                    const scoreVal = v.score ? parseFloat(v.score) : 0;
                    const scoreHTML = scoreVal > 0 ? ('<span class="playlist-video-score">' + scoreVal.toFixed(1) + '<\/span>') : '';
                    const starsHTML = scoreVal > 0 ? renderStars(scoreVal) : '';
                    
                    const ratingCount = v.ratingCount || "";
                    const ratingCountHTML = ratingCount ? ('<span class="playlist-video-rating-count">(' + ratingCount + '万+人)<\/span>') : '';

                    const badgeUrl = v.badgeUrl || v.badge_url || "";
                    const badgeHTML = badgeUrl ? ('<img class="playlist-video-badge" referrerpolicy="no-referrer" src="' + badgeUrl + '" alt="badge">') : '';

                    const ratingSourceUrl = v.ratingSourceUrl || v.rating_source_url || "";
                    const doubanHTML = ratingSourceUrl ? ('<a class="playlist-video-douban-link" href="' + ratingSourceUrl + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">豆瓣 ↗<\/a>') : '';

                    const director = v.director || "未知";
                    const starring = v.starring || "未知";

                    gridHTML += 
                        '<div class="playlist-video-item" onclick="openDetail(' + trueId + ')">' +
                            '<div class="playlist-video-cover-wrap">' +
                                '<img class="playlist-video-cover" referrerpolicy="no-referrer" src="' + getAbsoluteCoverUrl(cover) + '" alt="' + v.title + '" onerror="this.classList.add(\'no-cover\')">' +
                                '<div class="playlist-video-cover-placeholder">无封面<\/div>' +
                            '<\/div>' +
                            '<div class="playlist-video-info">' +
                                '<div class="playlist-video-title-row">' +
                                    '<div class="playlist-video-title">' + v.title + '<\/div>' +
                                    '<div class="playlist-video-year">' + year + '<\/div>' +
                                '<\/div>' +
                                '<div class="playlist-video-rating-row">' +
                                    '<div style="display: flex; align-items: center; gap: 6px;">' +
                                        starsHTML +
                                        scoreHTML +
                                        ratingCountHTML +
                                    '<\/div>' +
                                    doubanHTML +
                                '<\/div>' +
                                '<div class="playlist-video-body-row">' +
                                    '<div class="playlist-video-body-left">' +
                                        '<div class="playlist-video-tag-row">' +
                                            tagsHTML +
                                        '<\/div>' +
                                        '<div class="playlist-video-crew-row">导演：' + director + '<\/div>' +
                                    '<\/div>' +
                                    badgeHTML +
                                '<\/div>' +
                                '<div class="playlist-video-crew-row">主演：' + starring + '<\/div>' +
                            '<\/div>' +
                        '<\/div>';
                });

                videosGrid.innerHTML = gridHTML;

            } catch (err) {
                console.error(err);
                videosGrid.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:40px 0;text-align:center;">加载片单内容失败: ' + err.message + '<\/div>';
            }
        }

        // Back to Level 1
        function goBackToPlaylists() {
            document.getElementById('playlistsView').style.display = 'block';
            document.getElementById('playlistDetailView').style.display = 'none';
        }

        // Run on startup
        window.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
