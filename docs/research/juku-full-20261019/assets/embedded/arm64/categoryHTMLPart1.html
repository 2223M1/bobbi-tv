<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视分类 - 巨库</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/kodi-remote.css">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #6366F1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px calc(100px + env(safe-area-inset-bottom)) 16px;
            position: relative;
        }

        /* Ambient Orbs */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #6366F1;
        }

        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #D946EF;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
            margin-bottom: 16px;
            padding-bottom: 4px;
            margin-top: 10px;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .category-tab {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #6366F1 0%, #D946EF 100%);
            border: none;
            color: white;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        /* Collapsible Filter Panel */
        .filter-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 20px;
            text-align: left;
            transition: all 0.3s ease;
        }
        .filter-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            user-select: none;
        }
        .filter-summary-info {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        .filter-summary-dot {
            color: var(--primary);
            font-weight: 700;
            margin: 0 2px;
        }
        .filter-summary-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
        }
        .filter-summary-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
        }
        .filter-panel.open .filter-summary-btn svg {
            transform: rotate(180deg);
        }
        .filter-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: 1px solid transparent;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        margin-top 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        padding-top 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease;
        }
        .filter-panel.open .filter-content {
            max-height: 500px;
            opacity: 1;
            margin-top: 14px;
            padding-top: 14px;
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        .filter-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            padding-top: 4px;
            white-space: nowrap;
            width: 32px;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 90px;
            overflow-y: auto;
            width: 100%;
            padding-right: 4px;
        }
        /* Custom scrollbar for options list if overflow */
        .filter-options::-webkit-scrollbar {
            width: 4px;
        }
        .filter-options::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .filter-opt-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-opt-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.08);
        }
        .filter-opt-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
        }

        /* Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
            text-align: left;
            width: 100%;
        }

        @media (min-width: 480px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .video-cover-wrap {
            position: relative;
            width: 100%;
            padding-top: 140%; /* 5:7 ratio */
            background: rgba(15, 23, 42, 0.4);
            overflow: hidden;
        }

        .video-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            z-index: 1;
        }

        .video-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.3s ease;
            z-index: 2;
        }

        .video-cover.no-cover {
            opacity: 0;
        }

        .video-card:hover .video-cover {
            transform: scale(1.05);
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            z-index: 3;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .video-tag {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        /* Message and Spinner */
        .msg-box {
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            width: 100%;
        }

        .spinner-large {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Infinite scroll loader */
        .loading-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 0;
            font-size: 12px;
            color: var(--text-muted);
            width: 100%;
        }
        .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
