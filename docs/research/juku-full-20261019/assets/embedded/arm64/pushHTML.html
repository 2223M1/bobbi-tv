<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页推送播放 - 巨库</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/kodi-remote.css">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #6366F1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 100px;
            position: relative;
        }

        /* Decorative Background Wrapper */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        /* Decorative Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: 1;
            animation: drift 20s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #818cf8;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #db2777;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-weight: 700;
            font-size: 20px;
            color: white;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #FFFFFF, #E2E8F0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #E2E8F0;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--input-focus);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--input-focus);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .tip-box {
            background: rgba(99, 102, 241, 0.06);
            border: 1px dashed rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        .tip-title {
            font-size: 12px;
            font-weight: 600;
            color: #818CF8;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tip-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #334155; color: #64748B; box-shadow: none; cursor: not-allowed; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 14px;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.2); color: #34D399; }
        .status-error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.2); color: #F87171; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Nav Bar */
        .nav-bar {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px;
            right: 20px;
            width: auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        @media (min-width: 400px) {
            .nav-bar {
                left: calc(50% - 190px);
                right: auto;
                width: 380px;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            transition: all 0.3s ease;
            width: 55px;
            margin: 0;
            padding: 4px 0;
        }

        .nav-item:hover {
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: #6366F1;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            transition: stroke 0.3s ease;
        }

        .nav-item.active .nav-icon {
            stroke: #6366F1;
            filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.6));
        }

        @media (max-height: 480px) {
            .nav-bar {
                display: none;
            }
        }
    </style>
</head>
    <div class="bg-wrapper">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>网页推送播放</h1>
                <p class="subtitle">请输入网盘或磁力/ED2K下载链接，Kodi 插件将自动解析并开始播放</p>
            </div>
            
            <form id="pushForm">
                <div class="form-group">
                    <label for="urlInput">视频播放链接 (网盘 / 磁力 / ED2K)</label>
                    <textarea id="urlInput" placeholder="请在此处粘贴网盘分享链接、磁力链接 (magnet:?) 或电驴链接 (ed2k://)..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="codeInput">提取码 / 密码（可选）</label>
                    <input type="text" id="codeInput" placeholder="如有提取码请输入...">
                </div>

                <div class="form-group">
                    <label for="titleInput">友好标题（可选）</label>
                    <input type="text" id="titleInput" placeholder="输入识别名称，留空将自动尝试解析文件/文件夹名...">
                </div>

                <div class="tip-box">
                    <div class="tip-title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span>功能说明</span>
                    </div>
                    <div class="tip-desc">
                        1. 推送成功后，Kodi 插件后台服务将自动拦截该链接并在 Kodi 中拉起播放。<br>
                        2. 支持磁力与 ED2K 链接，将自动通过 115 网盘极速云下载秒播并展开选集。<br>
                        3. 若分享链接包含多个视频文件（如剧集目录），将自动在 Kodi 中更新页面展开列表。<br>
                        4. 若您未登录对应网盘或 115，Kodi 屏幕上将弹出扫码登录提示。
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <div class="spinner" id="btnSpinner"></div>
                    <span id="btnText">开始推送</span>
                </button>
            </form>

            <div class="status-message" id="statusMsg"></div>
        </div>
    </div>

    <!-- Bottom Nav Bar -->
    <div class="nav-bar">
        <a href="/" class="nav-item" id="nav-home">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>推荐</span>
        </a>
        <a href="/l" class="nav-item" id="nav-lists">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>片单</span>
        </a>
        <a href="/c" class="nav-item" id="nav-category">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>分类</span>
        </a>
        <a href="/sq" class="nav-item" id="nav-share">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>广场</span>
        </a>
        <a href="/private" class="nav-item" id="nav-private">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span>私有库</span>
        </a>
        <a href="/s" class="nav-item" id="nav-search">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>搜索</span>
        </a>
        <a href="/p" class="nav-item active" id="nav-push">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>推送</span>
        </a>
        <a href="/qr" class="nav-item" id="nav-pan">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>网盘</span>
        </a>
    </div>

    <script>
        const form = document.getElementById('pushForm');
        const urlInput = document.getElementById('urlInput');
        const codeInput = document.getElementById('codeInput');
        const titleInput = document.getElementById('titleInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.innerText = '正在推送...';
            statusMsg.style.display = 'none';

            const payload = {
                url: urlInput.value.trim(),
                code: codeInput.value.trim(),
                title: titleInput.value.trim()
            };

            fetch('/api/push', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || '推送失败') });
                }
                return response.json();
            })
            .then(data => {
                statusMsg.className = 'status-message status-success';
                statusMsg.innerText = '推送成功！Kodi 正在为您拉起解析播放，解析到的标题为：' + (data.title || '未知');
                statusMsg.style.display = 'block';
                
                btnText.innerText = '推送成功';
                btnSpinner.style.display = 'none';
                
                setTimeout(() => {
                    submitBtn.disabled = false;
                    btnText.innerText = '开始推送';
                    urlInput.value = '';
                    codeInput.value = '';
                    titleInput.value = '';
                }, 3000);
            })
            .catch(error => {
                statusMsg.className = 'status-message status-error';
                statusMsg.innerText = '推送失败: ' + error.message;
                statusMsg.style.display = 'block';
                
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.innerText = '开始推送';
            });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
    <script src="/static/kodi-remote.js"></script>
</body>
</html>
