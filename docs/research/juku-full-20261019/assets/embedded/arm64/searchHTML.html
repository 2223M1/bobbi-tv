<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频搜索 - 巨库</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/kodi-remote.css">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #6366F1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px calc(100px + env(safe-area-inset-bottom)) 16px;
            position: relative;
        }

        /* Ambient Orbs */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #6366F1;
        }

        .orb-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #D946EF;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #6366F1 0%, #D946EF 100%);
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #FFFFFF, #C7D2FE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Search Input */
        .search-box {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .search-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .search-btn {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .search-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Search Results Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
            text-align: left;
        }

        @media (min-width: 480px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .video-cover-wrap {
            position: relative;
            width: 100%;
            padding-top: 140%; /* 5:7 ratio */
            background: rgba(15, 23, 42, 0.4);
            overflow: hidden;
        }

        .video-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .video-cover {
            transform: scale(1.05);
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .video-tag {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        /* Message and Spinner */
        .msg-box {
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .spinner-large {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }


        /* Modal Detail Dialog */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 92vh;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modalSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
        }

        @keyframes modalSlide {
            from { transform: scale(0.9) translateY(20px); }
            to { transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .detail-meta-row {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        @media (max-width: 576px) {
            .modal-body {
                padding: 16px !important;
            }
            .detail-meta-row {
                gap: 12px !important;
                margin-bottom: 16px !important;
            }
            .detail-cover-wrap {
                width: 90px !important;
                height: 126px !important;
                border-radius: 8px !important;
            }
            .detail-title {
                font-size: 15px !important;
            }
            .pan-sort-bar {
                background: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 4px 8px 4px !important;
            }
            .sort-btn {
                font-size: 10px !important;
                padding: 3px 6px !important;
            }
        }

        .detail-cover-wrap {
            width: 110px;
            height: 154px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            background: rgba(15, 23, 42, 0.6);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .detail-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 1;
        }

        .detail-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .detail-cover.no-cover {
            opacity: 0;
        }

        .detail-meta-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            justify-content: center;
            flex: 1;
            min-width: 0;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 800;
            color: white;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-extra-meta {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 36px;
        }

        .detail-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
            gap: 16px;
        }

        .detail-tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            padding: 8px 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .detail-tab-btn.active {
            color: var(--primary);
            border-color: var(--primary);
        }

        .source-panel {
            display: none;
            text-align: left;
            padding-right: 4px;
        }

        .source-panel.active {
            display: block;
        }

        .pan-sub-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .pan-sub-tabs::-webkit-scrollbar {
            display: none;
        }
        .pan-sub-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .pan-sub-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }
        .pan-sub-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .hls-line-section {
            margin-bottom: 16px;
        }

        .hls-line-title {
            font-size: 12px;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
        }

        .ep-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ep-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: white;
        }

        .pan-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .pan-item-row:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            transform: scale(1.01);
        }

        .pan-item-row:active {
            transform: scale(0.99);
        }

        .pan-sort-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px;
            margin: 4px 12px 12px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sort-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 2px;
            transition: all 0.2s ease;
            user-select: none;
            border-radius: 4px;
        }
        .sort-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }
        .sort-btn.active {
            color: var(--primary);
            font-weight: 700;
            background: rgba(99, 102, 241, 0.08);
        }
        .sort-arrow {
            font-size: 10px;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .pan-name-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .pan-ali { background-color: #fca5a5; color: #7f1d1d; }
        .pan-qk { background-color: #93c5fd; color: #1e3a8a; }
        .pan-uc { background-color: #fde047; color: #713f12; }
        .pan-bd { background-color: #a7f3d0; color: #064e3b; }
        .pan-xl { background-color: #c084fc; color: #581c87; }
        .pan-other { background-color: rgba(255,255,255,0.1); color: var(--text-main); }

        .pan-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        /* Scrollable long pan link remarks */
        .pan-remark-scrollable {
            display: inline-block;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            color: var(--text-muted);
            font-size: 12px;
            font-family: inherit;
        }

        .pan-remark-scrollable::-webkit-scrollbar {
            display: none;
        }

        .pan-push-btn {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pan-push-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* Scrollable long filenames */
        .pan-file-name-scrollable {
            display: inline-block;
            max-width: 250px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 12px;
            font-family: inherit;
        }

        .pan-file-name-scrollable::-webkit-scrollbar {
            display: none;
        }

        .cloud-down-tasks-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cloud-down-tasks-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: white;
        }

        .down-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        .down-item-card:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.35);
            transform: scale(1.005);
        }
        .down-item-card:active {
            transform: scale(0.995);
        }
        .down-item-main {
            flex: 1;
            overflow: hidden;
        }
        .down-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }
        .down-item-tag {
            color: #818cf8;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
        }
        .down-item-url {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }

        .task-action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .task-action-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: white;
        }
        .task-action-btn.btn-play {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
            color: #818cf8;
        }
        .task-action-btn.btn-play:hover {
            background: rgba(99, 102, 241, 0.4);
            color: white;
        }
        .task-action-btn.btn-del {
            color: #ff3b30;
            border-color: rgba(255, 59, 48, 0.2);
        }
        .task-action-btn.btn-del:hover {
            background: rgba(255, 59, 48, 0.15);
            border-color: #ff3b30;
        }


        /* Toast notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.toast-error {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Bottom Nav Bar */
        .nav-bar {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px;
            right: 20px;
            width: auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;

    <script>
        let currentSearchType = 'internal';
        let currentPansouResults = {};

        const ALL_PANS = [
            { id: 'aliyun', name: '阿里云盘' },
            { id: 'quark', name: '夸克网盘' },
            { id: 'uc', name: 'UC网盘' },
            { id: 'baidu', name: '百度网盘' },
            { id: 'xunlei', name: '迅雷网盘' },
            { id: '123', name: '123云盘' },
            { id: '115', name: '115网盘' },
            { id: 'mobile', name: '移动云盘' },
            { id: 'tianyi', name: '天翼云盘' },
            { id: 'guangya', name: '光鸭云盘' },
            { id: 'magnet', name: '磁力链接' },
            { id: 'ed2k', name: '电驴链接' }
        ];

        // Press Enter to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        });

        // Switch Search Tab
        function switchSearchTab(type) {
            if (currentSearchType === type) return;
            currentSearchType = type;
            
            document.getElementById('tab-internal').classList.toggle('active', type === 'internal');
            document.getElementById('tab-pansou').classList.toggle('active', type === 'pansou');
            
            const settingsBtn = document.getElementById('pansouSettingsBtn');
            const searchInput = document.getElementById('searchInput');
            const resultsContent = document.getElementById('resultsContent');
            const pagination = document.getElementById('pagination');
            
            pagination.classList.remove('active');
            
            if (type === 'internal') {
                settingsBtn.style.display = 'none';
                searchInput.placeholder = '搜索电影、电视剧、动漫...';
                resultsContent.innerHTML = '<div class="msg-box">输入关键字并点击搜索开始，指令将同步推送到 Kodi</div>';
            } else {
                settingsBtn.style.display = 'flex';
                searchInput.placeholder = '在全网盘搜中寻找资源...';
                resultsContent.innerHTML = '<div class="msg-box">输入关键字并点击搜索开始全网盘搜</div>';
            }
        }

        // Trigger search based on tab
        function triggerSearch() {
            if (currentSearchType === 'internal') {
                startSearch(1);
            } else {
                startPansouSearch();
            }
        }

        // Pansou Configuration Modal Actions
        async function openPansouConfigModal() {
            const modal = document.getElementById('pansouConfigModal');
            modal.classList.add('active');
            
            try {
                const response = await fetch('/api/pansou/config');
                if (!response.ok) throw new Error("获取配置失败");
                const config = await response.json();
                
                document.getElementById('pansouAddr').value = config.addr || 'https://so.252035.xyz';
                document.getElementById('pansouUser').value = config.username || '';
                document.getElementById('pansouPass').value = config.password || '';

        // Start Internal Search
        async function startSearch(page = 1) {

            currentQuery = query;
            currentPage = page;

            const resultsContent = document.getElementById('resultsContent');
            const pagination = document.getElementById('pagination');

            if (page === 1) {
                resultsContent.innerHTML = '<div class="spinner-large"></div>';
                pagination.classList.remove('active');

            try {
                const response = await fetch('/api/mv/videos/search?q=' + encodeURIComponent(query) + '&page=' + page + '&pageSize=21');
                if (!response.ok) throw new Error("HTTP " + response.status);
                const rawData = await response.json();
                
                const data = rawData.data || {};
                const videos = data.items || [];
                const pag = data.pagination || {};
                
                totalPages = pag.totalPages || 1;
                
                if (videos.length === 0) {
                    resultsContent.innerHTML = '<div class="msg-box">没有找到相关资源</div>';
                    pagination.classList.remove('active');
                    return;

                let gridHTML = '<div class="video-grid">';
                videos.forEach(v => {
                    const cover = v.pic || v.coverUrl || v.sourceCoverUrl || '';
                    const year = v.year || '未知';
                    const label = v.typeName || '';
                    gridHTML += 
                        '<div class="video-card" onclick="openDetail(' + v.id + ')">' +
                            '<div class="video-cover-wrap">' +
                                '<img class="video-cover" referrerpolicy="no-referrer" src="' + getAbsoluteCoverUrl(cover) + '" alt="' + v.title + '" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22140%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23222%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 font-size=%2212%22 text-anchor=%22middle%22>无封面</text></svg>\'">' +
                            '</div>' +
                            '<div class="video-info">' +
                                '<div class="video-title">' + v.title + '</div>' +
                                '<div class="video-meta">' +
                                    '<span>' + year + '</span>' +
                                    (label ? '<span class="video-tag">' + label + '</span>' : '') +
                                '</div>' +
                            '</div>' +
                        '</div>';
                });
                gridHTML += '</div>';
                
                resultsContent.innerHTML = gridHTML;
                
                // Update pagination controls
                document.getElementById('pageInfo').innerText = '第 ' + page + ' / ' + totalPages + ' 页';
                document.getElementById('prevPageBtn').disabled = (page <= 1);
                document.getElementById('nextPageBtn').disabled = (page >= totalPages);

                // Remote control Kodi to search
                const kodiCmd = 'Container.Update("plugin://plugin.video.juku/?action=search&q=' + encodeURIComponent(query) + '")';

        // Start Pansou Search
        async function startPansouSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = '<div class="spinner-large"></div><div style="text-align:center;color:var(--text-muted);font-size:12px;">正在连接盘搜接口搜索资源...</div>';

            try {
                const response = await fetch('/api/pansou/search?kw=' + encodeURIComponent(query));
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || ("HTTP " + response.status));
                }
                const data = await response.json();
                
                currentPansouResults = data.merged_by_type || {};
                
                const activePans = [];
                for (let pan in currentPansouResults) {
                    if (currentPansouResults[pan] && currentPansouResults[pan].length > 0) {
                        activePans.push(pan);
                    }
                }
                
                if (activePans.length === 0) {
                    resultsContent.innerHTML = '<div class="msg-box">盘搜没有找到相关资源</div>';
                    return;
                }
                
                activePans.sort((a, b) => {
                    const idxA = ALL_PANS.findIndex(p => p.id === a);
                    const idxB = ALL_PANS.findIndex(p => p.id === b);
                    return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
                });
                
                let subTabsHTML = '<div class="pansou-sub-tabs">';
                activePans.forEach((pan, idx) => {
                    const panInfo = ALL_PANS.find(p => p.id === pan) || { name: pan };
                    const count = currentPansouResults[pan].length;
                    const isActive = idx === 0;
                    subTabsHTML += '<button class="pansou-sub-tab' + (isActive ? ' active' : '') + '" data-pan="' + pan + '" onclick="switchPansouSubTab(\'' + pan + '\')">' + panInfo.name + ' ' + count + '</button>';
                });
                subTabsHTML += '</div><div id="pansouList"></div>';
                
                resultsContent.innerHTML = subTabsHTML;
                
                renderPansouList(activePans[0]);
                
            } catch (err) {
                console.error(err);
                resultsContent.innerHTML = '<div class="msg-box" style="color:var(--color-expired);">盘搜搜索失败: ' + err.message + '</div>';
            }
        }

        function renderPansouList(panType) {
            const container = document.getElementById('pansouList');
            if (!container) return;

            const items = currentPansouResults[panType] || [];
            let html = '';
            
            const panInfo = ALL_PANS.find(p => p.id === panType) || { name: panType };
            
            items.forEach((item, idx) => {
                const coverUrl = (item.images && item.images.length > 0) ? ('/api/img_proxy?url=' + encodeURIComponent(item.images[0])) : '';
                const displayCover = coverUrl ? ('src="' + coverUrl + '"') : '';
                
                let cleanTime = '';
                let hasTime = false;
                if (item.datetime) {
                    let t = item.datetime.replace('T', ' ').replace('Z', '');
                    t = t.replace(/\+[0-9]{2}:?[0-9]{2}$/, '');
                    if (t.indexOf('0001-01-01') === -1 && t.trim() !== '') {
                        hasTime = true;
                        cleanTime = t.trim();
                    }
                }
                
                const sourceStr = item.source || '';
                const urlStr = item.url || '';
                
                let metaHTML = '<span>' + panInfo.name + '</span>';
                if (sourceStr) {
                    metaHTML += '<span class="dot"></span><span>' + sourceStr + '</span>';
                }
                if (hasTime) {
                    metaHTML += '<span class="dot"></span><span>' + cleanTime + '</span>';
                }
                
                html += 
                    '<div class="pansou-item" onclick="triggerPansouPlay(\'' + panType + '\', ' + idx + ')">' +
                        (coverUrl ? 
                            '<img class="pansou-cover" referrerpolicy="no-referrer" ' + displayCover + ' />' : 
                            '<div class="pansou-cover" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;background:rgba(255,255,255,0.03);">无海报</div>'

                    '</div>';
            });

        // Helper to format absolute cover image url
        function getAbsoluteCoverUrl(url) {
            if (!url) return '';
            if (url.indexOf('image.tmdb.org') !== -1 && url.indexOf('/api/image/proxy') === -1) {
                return '/api/image/proxy?url=' + encodeURIComponent(url);
            }
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return url;
            }
            if (url.startsWith('//')) {
                return 'https:' + url;
            }
            if (url.startsWith('/')) {
                return '/api/image/proxy?url=' + encodeURIComponent('https://image.tmdb.org/t/p/original' + url);
            }
            return '/api/image/proxy?url=' + encodeURIComponent(url);
        }

        function getAbsoluteBackdropUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) {

        // Sorting state and controllers for pan links

            const fields = ['id', 'fileNum', 'avgFileSize', 'avgDuration'];
            fields.forEach(f => {
                const btn = document.getElementById('sort-btn-' + f);
                if (!btn) return;
                if (f === currentSortField) {

                        arrow.innerText = currentSortOrder === 'desc' ? '▼' : '▲';

                    btn.classList.remove('active');

                    if (arrow) {
                        arrow.innerText = '';

                }

        function togglePanSort(field) {
            if (currentSortField === field) {
                currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                currentSortField = field;
                currentSortOrder = 'desc';
            }
            localStorage.setItem('juku_pan_sort_field', currentSortField);
            localStorage.setItem('juku_pan_sort_order', currentSortOrder);
            
            updateSortBarUI();
            
            const activeTab = document.querySelector('.pan-sub-tab.active');
            if (activeTab) {
                renderPanLinks(activeTab.getAttribute('data-pan'));
            }

        // Render pan links inside the sub-tab container
        function renderPanLinks(panName) {
            const container = document.getElementById('panLinksList');
            if (!container) return;

            let sortedLinks = (currentPanList[panName] || []).map((link, index) => {
                return { ...link, _originalIdx: index };
            });

            sortedLinks.sort((a, b) => {
                let valA = a[currentSortField];
                let valB = b[currentSortField];

                if (valA === undefined || valA === null) valA = 0;
                if (valB === undefined || valB === null) valB = 0;

                if (currentSortField === 'id') {
                    const intA = parseInt(valA) || 0;
                    const intB = parseInt(valB) || 0;
                    return currentSortOrder === 'desc' ? intB - intA : intA - intB;
                }

                if (currentSortField === 'avgDuration') {
                    const sizeA = Number(a.avgFileSize) || 0;
                    const durA = Number(a.avgDuration) || 0;
                    const bitrateA = durA > 0 ? (sizeA * 8) / durA : 0;

                    const sizeB = Number(b.avgFileSize) || 0;
                    const durB = Number(b.avgDuration) || 0;
                    const bitrateB = durB > 0 ? (sizeB * 8) / durB : 0;

                    return currentSortOrder === 'desc' ? bitrateB - bitrateA : bitrateA - bitrateB;
                }

                const numA = Number(valA);
                const numB = Number(valB);
                return currentSortOrder === 'desc' ? numB - numA : numA - numB;
            });

            let html = '';
            const shortName = PROVIDER_NAMES[panName] || panName;
            const displayClass = ('pan-' + panName) in { 'pan-ali': 1, 'pan-qk': 1, 'pan-uc': 1, 'pan-bd': 1, 'pan-xl': 1 } ? ('pan-' + panName) : 'pan-other';
            
            sortedLinks.forEach((link, idx) => {
                // const remark = link.remark ? (' [' + link.remark + ']') : '';
                const label = '链接' + (idx + 1) + link.remark;
                
                html += 
                    '<div class="pan-item-row" onclick="openPanFiles(' + link._originalIdx + ', \'' + panName + '\')">' +
                        '<div class="pan-item-info">' +
                            '<span class="pan-name-tag ' + displayClass + '">' + shortName + '<\/span>' +
                            '<span class="pan-remark-scrollable" title="' + label + ', 左右滑动可查看完整备注">' + label + '<\/span>' +
                        '<\/div>' +

                    '<\/div>';
            });
            container.innerHTML = html || '<div style="color:var(--text-muted);font-size:12px;padding:20px 0;text-align:center;">该网盘下暂无链接<\/div>';

        // Switch Tabs inside modal

                tab.classList.toggle('active', tab.getAttribute('data-pan') === panName);
            });

        }

        function formatBytes(bytes) {
            if (!bytes || bytes <= 0) return '';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let val = parseFloat(bytes);
            let idx = 0;
            while (val >= 1024 && idx < units.length - 1) {
                val /= 1024;
                idx++;
            }
            return (idx === 0 ? val.toFixed(0) : val.toFixed(1)) + ' ' + units[idx];
        }

        // Switch Detail Tabs inside modal
        function switchDetailTab(tab) {
            const btnHls = document.getElementById('tab-btn-hls');
            const btnPan = document.getElementById('tab-btn-pan');
            const btnDown = document.getElementById('tab-btn-down');
            const panelHls = document.getElementById('panel-hls');
            const panelPan = document.getElementById('panel-pan');
            const panelDown = document.getElementById('panel-down');

            if (btnHls) btnHls.classList.toggle('active', tab === 'hls');
            if (btnPan) btnPan.classList.toggle('active', tab === 'pan');
            if (btnDown) btnDown.classList.toggle('active', tab === 'down');
            if (panelHls) panelHls.classList.toggle('active', tab === 'hls');
            if (panelPan) panelPan.classList.toggle('active', tab === 'pan');
            if (panelDown) panelDown.classList.toggle('active', tab === 'down');
        }

        async function loadCloudDownTasks() {
            const container = document.getElementById('cloudDownTasksContent');
            if (!container) return;
            container.innerHTML = '<div style="text-align:center;padding:25px 0;color:var(--text-muted);font-size:12px;">正在获取 115 任务列表...<\/div>';

            try {
                const res = await fetch('/api/115/offline/tasks?page=1');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const tasks = data.tasks || [];
                if (tasks.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:35px 0;color:var(--text-muted);font-size:12px;">暂无 115 云下载任务<\/div>';
                    return;
                }

                let html = '';
                tasks.forEach(t => {
                    const name = t.name || t.url || '未知任务';
                    const sizeStr = formatBytes(t.size);
                    const status = t.status;
                    const percent = t.display_percent || t.percent_done || 0;
                    const rate = t.rate_download || 0;
                    const speedStr = rate > 0 ? (formatBytes(rate) + '/s') : '';
                    const hash = t.info_hash || '';
                    const vodTitle = t.vod_title || '';
                    const displayName = (vodTitle && !name.startsWith(vodTitle)) ? (vodTitle + '：（' + name + '）') : name;

                    let statusBadge = '';
                    let actionBtn = '';
                    if (status === 2) {
                        statusBadge = '<span style="background:rgba(52,199,89,0.15);color:#34c759;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;">已完成<\/span>';
                        const fileId = t.file_id || '';
                        const pickCode = t.pick_code || '';
                        const safeFileId = (fileId || '').replace(/'/g, "\\'");
                        const safePickCode = (pickCode || '').replace(/'/g, "\\'");
                        const safeDisplayName = displayName.replace(/'/g, "\\'");
                        const safeVodTitle = vodTitle.replace(/'/g, "\\'");
                        actionBtn = '<button class="task-action-btn btn-play" style="margin-right:6px;" onclick="handlePlayCloudDownTask(\'' + safeFileId + '\', \'' + safePickCode + '\', \'' + safeDisplayName + '\', \'' + safeVodTitle + '\')">▶ 播放<\/button>';
                    } else if (status === 0 || status === 1) {
                        const statusTxt = t.status_text || '下载中';
                        statusBadge = '<span style="background:rgba(0,122,255,0.15);color:#007aff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;">' + statusTxt + ' ' + Math.floor(percent) + '%' + (speedStr ? (' · ' + speedStr) : '') + '<\/span>';
                    } else {
                        statusBadge = '<span style="background:rgba(255,59,48,0.15);color:#ff3b30;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;">下载失败<\/span>';
                    }

                    html += 
                        '<div style="padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;">' +
                            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">' +
                                '<div style="font-size:12px;font-weight:600;color:var(--text-main);word-break:break-all;line-height:1.4;" title="' + displayName + '">' + displayName + '<\/div>' +
                                '<div style="flex-shrink:0;">' + statusBadge + '<\/div>' +
                            '<\/div>' +
                            '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">' +
                                '<div style="font-size:11px;color:var(--text-muted);">' + (sizeStr || '--') + '<\/div>' +
                                '<div style="display:flex;align-items:center;">' +
                                    actionBtn +
                                    '<button class="task-action-btn btn-del" onclick="deleteCloudDownTask(\'' + hash + '\')">删除<\/button>' +
                                '<\/div>' +
                            '<\/div>' +
                        '<\/div>';
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div style="text-align:center;padding:25px 0;color:var(--color-expired);font-size:12px;">加载失败: ' + e.message + '<\/div>';
            }
        }

        async function handlePlayCloudDownTask(fileId, pickCode, displayName, vodTitle) {
            showToast('正在解析任务播放地址...');
            try {
                const res = await fetch('/api/115/offline/resolve?file_id=' + encodeURIComponent(fileId) + '&pick_code=' + encodeURIComponent(pickCode));
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || ('HTTP ' + res.status));
                }
                const data = await res.json();
                if (data.is_dir && data.sub_files && data.sub_files.length > 1) {
                    const modal = document.getElementById('panFilesModal');
                    const titleEl = document.getElementById('panFilesModalTitle');
                    const contentEl = document.getElementById('panFilesContent');
                    titleEl.innerText = (vodTitle || displayName) + ' - 选集列表';
                    let filesHtml = '';
                    data.sub_files.forEach((f, idx) => {
                        const epName = f.file_name || ('第 ' + (idx + 1) + ' 集');
                        const fSizeStr = formatBytes(f.file_size);
                        const targetSubFid = f.file_id || '';
                        const targetSubPick = f.pick_code || '';
                        const playCmd = 'PlayMedia("plugin://plugin.video.juku/?action=cloud_down_task_play&file_id=' + encodeURIComponent(targetSubFid) + '&pick_code=' + encodeURIComponent(targetSubPick) + '&title=' + encodeURIComponent(epName) + '&vod_title=' + encodeURIComponent(vodTitle || displayName) + '")';
                        const safePlayCmd = playCmd.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        const safeEpName = ((vodTitle || displayName) + ' ' + epName).replace(/'/g, "\\'");
                        filesHtml += 
                            '<div class="pan-file-item" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-bottom:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:6px;cursor:pointer;" onclick="playCloudDownVideo(\'' + safePlayCmd + '\', \'' + safeEpName + '\')">' +
                                '<div style="font-size:12px;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;" title="' + epName + '">▶ ' + epName + '<\/div>' +
                                '<div style="font-size:11px;color:var(--text-muted);flex-shrink:0;">' + fSizeStr + '<\/div>' +
                            '<\/div>';
                    });
                    contentEl.innerHTML = filesHtml;
                    modal.classList.add('active');
                    return;
                }

                const targetFileId = (data.sub_files && data.sub_files.length === 1 && data.sub_files[0].file_id) ? data.sub_files[0].file_id : fileId;
                const targetPick = (data.sub_files && data.sub_files.length === 1 && data.sub_files[0].pick_code) ? data.sub_files[0].pick_code : pickCode;
                const targetTitle = data.file_name || displayName;
                const playCmd = 'PlayMedia("plugin://plugin.video.juku/?action=cloud_down_task_play&file_id=' + encodeURIComponent(targetFileId) + '&pick_code=' + encodeURIComponent(targetPick) + '&title=' + encodeURIComponent(targetTitle) + '&vod_title=' + encodeURIComponent(vodTitle) + '")';
                const safePlayCmd = playCmd.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeTitle = (vodTitle ? (vodTitle + ' ' + targetTitle) : targetTitle).replace(/'/g, "\\'");
                playCloudDownVideo(safePlayCmd, safeTitle);
            } catch (e) {
                console.error(e);
                showToast('解析播放失败: ' + e.message, true);
            }
        }

        async function deleteCloudDownTask(hash) {
            if (!hash) return;
            if (!confirm('确定要删除此 115 云下载任务吗？')) return;
            try {
                const res = await fetch('/api/115/offline/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hash: hash, hashes: [hash], info_hash: hash, delete_files: false })
                });
                if (res.ok) {
                    showToast('已删除云下载任务');
                    loadCloudDownTasks();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    const errMsg = errData.error || ('HTTP ' + res.status);
                    showToast('删除任务失败: ' + errMsg, true);
                }
            } catch (e) {
                console.error(e);
                showToast('删除请求出错: ' + e.message, true);
            }
        }

        // Verify if error message indicates invalid sharing
        function shouldMarkPanLinkInvalid(errMsg) {
            if (!errMsg) return false;
            
            // Need login should NOT mark invalid
            if (errMsg.indexOf('登录') !== -1 || errMsg.indexOf('login') !== -1 || errMsg.indexOf('cookie') !== -1 || errMsg.indexOf('Cookie') !== -1) {
                return false;
            }
            
            const normalized = errMsg.replace(/：/g, ':');
            const isExplicitlyInvalid = normalized.indexOf('分享') !== -1 && (normalized.indexOf('已失效') !== -1 || normalized.indexOf('无可播放文件') !== -1 || normalized.indexOf('不存在') !== -1 || normalized.indexOf('取消') !== -1);
            const isShareTokenError = normalized.indexOf('分享 token 失败: HTTP 404') !== -1 || normalized.indexOf('分享 token 失败: HTTP 403') !== -1 || normalized.indexOf('404 Not Found') !== -1;
            
            return isExplicitlyInvalid || isShareTokenError;
        }

        // Report invalid link to main API and remove from display list
        async function reportAndRemoveInvalidLink(idx, panName, errMsg) {
            const links = currentPanList[panName] || [];
            const link = links[idx];
            if (!link) return;

            const linkId = link.id || "";
            
            // 1. Report invalid if we have linkId via local Go proxy proxying to main API
            if (linkId) {
                fetch('/api/mv/videos/pan-links/' + linkId + '/invalid', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ invalidReason: errMsg })
                }).catch(e => console.error("Report invalid failed:", e));
            }

            // 2. Remove from global state
            links.splice(idx, 1);
            currentPanList[panName] = links;

            // 3. Close the pan files modal since it is invalid
            closePanFilesModal();

            // 4. Re-render the links list to visually remove it
            renderPanLinks(panName);

            // 5. Toast feedback
            showToast("链接已失效，已自动上报并移除", true);
        }

        // Parse share link files list and open modal
        async function openPanFiles(idx, panName) {
            const links = currentPanList[panName] || [];
            const link = links[idx];
            if (!link) return;

            const rawUrl = link.url || '';
            const shareUrl = toShareUrl(rawUrl, panName);
            const code = link.code || link.pwd || '';

            const fileNum = (link.fileNum !== undefined && link.fileNum !== null) ? Number(link.fileNum) : ((link.file_num !== undefined && link.file_num !== null) ? Number(link.file_num) : null);
            if (fileNum !== null && fileNum >= 50) {
                openShareTreeModal(link.id || 0, rawUrl, currentDetailTitle || '网盘资源', panName, code);
                return;
            }

            currentResolvingUrl = shareUrl;
            currentResolvingCode = code;
            currentResolvingPanName = panName;

            const modal = document.getElementById('panFilesModal');
            const titleEl = document.getElementById('panFilesModalTitle');
            const contentEl = document.getElementById('panFilesContent');

            const shortName = PROVIDER_NAMES[panName] || panName;
            titleEl.innerText = shortName + "网盘 - 文件解析";
            contentEl.innerHTML = '<div class="spinner-large"><\/div><div style="text-align:center;color:var(--text-muted);font-size:12px;">正在调取网盘驱动解析目录树...<\/div>';
            modal.classList.add('active');

            try {
                // Fetch list from local backend API
                const reqUrl = '/api/list?share_url=' + encodeURIComponent(shareUrl) + '&code=' + encodeURIComponent(code);
                const response = await fetch(reqUrl);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error || ("HTTP " + response.status);
                    
                    // If link is expired/invalid, report to API and remove it
                    if (shouldMarkPanLinkInvalid(errMsg)) {
                        if (currentDetailId === 0) {
                            contentEl.innerHTML = '<div style="color:var(--color-expired);font-size:12px;padding:30px 0;text-align:center;">该链接已失效<\/div>';
                            return;
                        }
                        await reportAndRemoveInvalidLink(idx, panName, errMsg);
                        return;
                    }
                    throw new Error(errMsg);
                }
                const data = await response.json();
                const files = data.files || [];
                
                if (files.length === 0) {
                    if (currentDetailId === 0) {
                        contentEl.innerHTML = '<div style="color:var(--color-expired);font-size:12px;padding:30px 0;text-align:center;">该链接已失效（无可播放文件）<\/div>';
                        return;
                    }
                    // Empty list indicates no playable files, report invalid
                    await reportAndRemoveInvalidLink(idx, panName, "无可播放文件");
                    return;
                }

                // Render files list
                let html = '';
                files.forEach(f => {
                    const isFolder = f.is_folder;
                    const icon = isFolder ? '📁 ' : '🎬 ';
                    
                    if (isFolder) {
                        html += 
                            '<div class="pan-item-row" style="opacity: 0.6;">' +
                                '<div class="pan-item-info">' +
                                    '<span style="font-size: 14px;">' + icon + '<\/span>' +
                                    '<span class="pan-file-name-scrollable" style="color: var(--text-muted);" title="' + f.file_name + '">' + f.file_name + '<\/span>' +
                                '<\/div>' +
                            '<\/div>';
                    } else {
                        const safeFileName = f.file_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        const safeFileId = f.file_id.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        
                        html += 
                            '<div class="pan-item-row" style="cursor: pointer;" onclick="playPanFile(\'' + safeFileId + '\', \'' + safeFileName + '\')">' +
                                '<div class="pan-item-info">' +
                                    '<span style="font-size: 14px;">' + icon + '<\/span>' +
                                    '<span class="pan-file-name-scrollable" title="' + f.file_name + ', 左右滑动可查看全名">' + f.file_name + '<\/span>' +
                                '<\/div>' +
                                '<div style="font-size: 10px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; padding-left: 10px;">' + f.size_label + '<\/div>' +
                            '<\/div>';
                    }
                });

                contentEl.innerHTML = html;

            } catch (err) {
                console.error(err);
                contentEl.innerHTML = '<div style="color:var(--color-expired);font-size:12px;padding:30px 0;text-align:center;">解析失败: ' + err.message + '<\/div>';
            }
        }

        // Send pan file play command to Kodi
        async function playPanFile(fileId, fileName) {
            let backdropFull = getAbsoluteBackdropUrl(currentBackdropUrl);
            const typeId = currentDetailTypeId || 1;
            const isTv = (typeId == 2 || typeId === '2') ? '1' : '0';
            const cmdVal = 'PlayMedia("plugin://plugin.video.juku/?action=pan_play&url=' + encodeURIComponent(currentResolvingUrl) + 
                                '&code=' + encodeURIComponent(currentResolvingCode) + 
                                '&file_id=' + encodeURIComponent(fileId) + 
                                '&pan_name=' + encodeURIComponent(currentResolvingPanName) + 
                                '&file_name=' + encodeURIComponent(fileName) + 
                                '&vod_title=' + encodeURIComponent(currentDetailTitle) + 
                                '&vod_id=' + currentDetailId + 
                                '&type_id=' + typeId + 
                                '&is_tv=' + isTv + 
                                '&pic=' + encodeURIComponent(getAbsoluteCoverUrl(currentCoverUrl || '')) + 
                                '&fanart=' + encodeURIComponent(backdropFull) + 
                                '&from_share=1")';

            sendKodiCommand(cmdVal, '已遥控 Kodi 播放网盘文件: ' + fileName);
        }

        function showFullDesc() {
            const descModal = document.getElementById('descModal');
            const descModalText = document.getElementById('descModalText');
            if (descModal && descModalText) {
                descModalText.innerText = currentFullDesc;
                descModal.classList.add('active');
            }
        }

        function closeDescModal() {
            const descModal = document.getElementById('descModal');
            if (descModal) {
                descModal.classList.remove('active');
            }
        }

        function closePanFilesModal() {
            const modal = document.getElementById('panFilesModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Close modal when clicking background
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close desc modal when clicking background
        document.getElementById('descModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDescModal();
            }
        });

        // Close pan files modal when clicking background
        document.getElementById('panFilesModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePanFilesModal();
            }
        });

        // Close cloud down tasks modal when clicking background
        const cloudDownTasksModal = document.getElementById('cloudDownTasksModal');
        if (cloudDownTasksModal) {
            cloudDownTasksModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeCloudDownTasksModal();
                }
            });
        }

        // ==============================================================================
        // Share Tree Modal & Functions (for file_num >= 100)
        // ==============================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJsString(str) {
            if (!str) return '';
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function isMediaFile(name) {
            if (!name) return false;
            const ext = name.split('.').pop().toLowerCase();
            const mediaExts = ['mp4', 'mkv', 'avi', 'flv', 'mov', 'wmv', 'ts', 'm2ts', 'rmvb', 'iso', 'm3u8', 'mpd', 'webm', 'mp3', 'flac', 'wav', 'ape', 'dts', 'm4a', 'aac', 'ogg', 'wma', 'opus', 'alac', 'aiff', 'dsf', 'dff', 'ac3', 'pcm', 'mid', 'midi', 'mka'];
            return mediaExts.indexOf(ext) !== -1;
        }

        let currentShareTreeContext = {
            shareId: 0,
            url: '',
            pwd: '',
            panType: '',
            vodTitle: '',
            breadcrumbs: []
        };

        let shareTreeState = {
            page: 1,
            pageSize: 50,
            hasMore: true,
            loading: false,
            armed: true,
            currentParentId: ''
        };

        function openShareTreeModal(shareId, url, title, panType, pwd) {
            const modal = document.getElementById('shareTreeModal');
            if (!modal) return;
            document.getElementById('shareTreeModalTitle').innerText = title;
            try { document.body.style.overflow = 'hidden'; } catch(e) {}
            
            currentShareTreeContext = {
                shareId: shareId,
                url: url,
                pwd: pwd,
                panType: panType,
                vodTitle: title,
                typeId: currentDetailTypeId || 1,
                breadcrumbs: [{ id: '', name: '根目录' }]
            };

            const content = document.getElementById('shareTreeContent');
            if (content) {
                content.onscroll = () => {
                    if (!shareTreeState.hasMore || shareTreeState.loading) return;
                    const distanceToBottom = content.scrollHeight - (content.scrollTop + content.clientHeight);
                    if (distanceToBottom > 200) {
                        shareTreeState.armed = true;
                    }
                    if (distanceToBottom <= 50 && shareTreeState.armed) {
                        shareTreeState.armed = false;
                        loadShareFiles(shareTreeState.currentParentId, true);
                    }
                };
            }

            modal.classList.add('active');
            renderShareBreadcrumbs();
            loadShareFiles('');
        }

        function closeShareTreeModal() {
            const modal = document.getElementById('shareTreeModal');
            if (modal) modal.classList.remove('active');
            try { document.body.style.overflow = ''; } catch(e) {}
        }

        function renderShareBreadcrumbs() {
            const subTitle = document.getElementById('shareTreeSubTitle');
            if (!subTitle) return;
            const { panType, url, breadcrumbs } = currentShareTreeContext;
            const panName = PROVIDER_NAMES[panType] || panType;

            let html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;">';
            html += '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-muted);">';
            html += '<span>' + panName + '</span>';

            breadcrumbs.forEach((b, idx) => {
                if (idx === breadcrumbs.length - 1) {
                    html += ' <span style="color:white;font-weight:700;">/ ' + escapeHtml(b.name) + '</span>';
                } else {
                    html += ' <span style="cursor:pointer;color:#818cf8;text-decoration:underline;" onclick="navToShareBreadcrumb(' + idx + ')">/ ' + escapeHtml(b.name) + '</span>';
                }
            });
            html += '</div>';

            if (breadcrumbs.length > 1) {
                html += '<button class="share-tool-btn" style="padding:2px 8px;font-size:11px;flex-shrink:0;" onclick="navBackShareFolder()">⬅️ 返回</button>';
            }
            html += '</div>';
            subTitle.innerHTML = html;
        }

        function enterShareFolder(fileId, folderName) {
            currentShareTreeContext.breadcrumbs.push({ id: fileId, name: folderName });
            renderShareBreadcrumbs();
            loadShareFiles(fileId);
        }

        function navBackShareFolder() {
            if (currentShareTreeContext.breadcrumbs.length > 1) {
                currentShareTreeContext.breadcrumbs.pop();
                renderShareBreadcrumbs();
                const last = currentShareTreeContext.breadcrumbs[currentShareTreeContext.breadcrumbs.length - 1];
                loadShareFiles(last.id);
            }
        }

        function navToShareBreadcrumb(index) {
            if (index >= 0 && index < currentShareTreeContext.breadcrumbs.length) {
                currentShareTreeContext.breadcrumbs = currentShareTreeContext.breadcrumbs.slice(0, index + 1);
                renderShareBreadcrumbs();
                const target = currentShareTreeContext.breadcrumbs[currentShareTreeContext.breadcrumbs.length - 1];
                loadShareFiles(target.id);
            }
        }

        async function loadShareFiles(parentFileId = '', append = false) {
            if (shareTreeState.loading) return;

            const content = document.getElementById('shareTreeContent');
            if (!content) return;
            
            if (!append) {
                shareTreeState.loading = true;
                shareTreeState.page = 1;
                shareTreeState.hasMore = true;
                shareTreeState.armed = true;
                shareTreeState.currentParentId = parentFileId;
                content.scrollTop = 0;
                content.innerHTML = '<div class="spinner-large"></div><div style="text-align:center;color:var(--text-muted);font-size:12px;">正在调取网盘驱动加载目录...</div>';
            } else {
                if (!shareTreeState.hasMore) return;
                shareTreeState.loading = true;
                shareTreeState.page += 1;
                let existingLoader = document.getElementById('shareTreeBottomLoader');
                if (!existingLoader) {
                    const loaderDiv = document.createElement('div');
                    loaderDiv.id = 'shareTreeBottomLoader';
                    loaderDiv.style.cssText = 'text-align:center;padding:12px;color:var(--text-muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;';
                    loaderDiv.innerHTML = '<div class="spinner-small"></div> 正在加载下一页...';
                    content.appendChild(loaderDiv);
                }
            }

            const { url, pwd, panType, vodTitle } = currentShareTreeContext;

            try {
                const fullUrl = toShareUrl(url, panType);
                const queryUrl = '/api/list?share_url=' + encodeURIComponent(fullUrl) + 
                                '&code=' + encodeURIComponent(pwd || '') + 
                                '&parent_file_id=' + encodeURIComponent(parentFileId || '') + 
                                '&flat=0' +
                                '&page=' + shareTreeState.page +
                                '&page_size=' + shareTreeState.pageSize;

                const res = await fetch(queryUrl);
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    const errMsg = errData.error || ("HTTP " + res.status);
                    throw new Error(errMsg);
                }
                const data = await res.json();
                const files = data.files || [];
                
                if (typeof data.has_more === 'boolean') {
                    shareTreeState.hasMore = data.has_more;
                } else {
                    shareTreeState.hasMore = files.length >= shareTreeState.pageSize;
                }

                let bottomLoader = document.getElementById('shareTreeBottomLoader');
                if (bottomLoader) {
                    bottomLoader.remove();
                }

                if (!append && files.length === 0) {
                    content.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--text-muted);font-size:12px;">此目录下暂无可播放文件或子文件夹</div>';
                    return;
                }

                let itemsHtml = '';
                files.forEach(f => {
                    const fName = f.file_name || '未命名文件';
                    const fSize = f.size_label || '';
                    const isMedia = !f.is_folder && isMediaFile(fName);

                    if (f.is_folder) {
                        itemsHtml += 
                            '<div class="pan-user-file-item" onclick="enterShareFolder(\'' + escapeJsString(f.file_id || '') + '\', \'' + escapeJsString(fName) + '\')">' +
                                '<div class="pan-user-file-info">' +
                                    '<span class="pan-user-file-icon">📁</span>' +
                                    '<span class="pan-user-file-name" style="font-weight:700;color:white;">' + escapeHtml(fName) + '</span>' +
                                '</div>' +
                                '<span style="font-size: 13px; color: var(--text-muted); padding-right: 4px;">&gt;</span>' +
                            '</div>';
                    } else if (isMedia) {
                        itemsHtml += 
                            '<div class="pan-user-file-item" onclick="playShareFile(\'' + escapeJsString(f.file_id || '') + '\', \'' + escapeJsString(fName) + '\')">' +
                                '<div class="pan-user-file-info">' +
                                    '<span class="pan-user-file-icon">🎬</span>' +
                                    '<span class="pan-user-file-name">' + escapeHtml(fName) + '</span>' +
                                '</div>' +
                                '<div class="pan-user-file-meta">' + fSize + '</div>' +
                            '</div>';
                    } else {
                        itemsHtml += 
                            '<div class="pan-user-file-item disabled" onclick="showToast(\'非音视频文件，暂不支持播放\', true)">' +
                                '<div class="pan-user-file-info">' +
                                    '<span class="pan-user-file-icon">📄</span>' +
                                    '<span class="pan-user-file-name" style="color:var(--text-muted);">' + escapeHtml(fName) + '</span>' +
                                '</div>' +
                                '<div class="pan-user-file-meta">' + fSize + '</div>' +
                            '</div>';
                    }
                });

                if (!append) {
                    let html = '<div class="pan-user-file-list" id="shareTreeList">' + itemsHtml + '</div>';
                    if (shareTreeState.hasMore) {
                        html += '<div id="shareTreeEndHint" style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">下拉滚动加载更多...</div>';
                    } else if (files.length > 0) {
                        html += '<div id="shareTreeEndHint" style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">已加载全部内容</div>';
                    }
                    content.innerHTML = html;
                } else {
                    const listContainer = document.getElementById('shareTreeList');
                    if (listContainer) {
                        listContainer.insertAdjacentHTML('beforeend', itemsHtml);
                    }
                    if (files.length > 0) {
                        shareTreeState.armed = true;
                    }
                    const endHint = document.getElementById('shareTreeEndHint');
                    if (endHint) {
                        if (shareTreeState.hasMore) {
                            endHint.innerText = '下拉滚动加载更多...';
                        } else {
                            endHint.innerText = '已加载全部内容';
                        }
                    }
                }
            } catch (err) {
                if (!append) {
                    content.innerHTML = '<div style="text-align:center;color:#fca5a5;padding:30px 0;">获取文件列表失败: ' + escapeHtml(err.message) + '</div>';
                } else {
                    showToast('加载下一页失败: ' + err.message, true);
                }
            } finally {
                shareTreeState.loading = false;
            }
        }

        async function playShareFile(fileId, fileName) {
            const { url, pwd, panType, vodTitle } = currentShareTreeContext;
            const fullUrl = toShareUrl(url, panType);
            const vodId = currentDetailId || 0;
            const typeId = (currentShareTreeContext && currentShareTreeContext.typeId) || currentDetailTypeId || 1;
            const isTv = (typeId == 2 || typeId === '2') ? '1' : '0';
            const cover = currentCoverUrl || '';
            let backdropFull = getAbsoluteBackdropUrl(currentBackdropUrl);
            
            const cmdVal = 'PlayMedia("plugin://plugin.video.juku/?action=pan_play&url=' + encodeURIComponent(fullUrl) + 
                                '&code=' + encodeURIComponent(pwd || '') + 
                                '&file_id=' + encodeURIComponent(fileId) + 
                                '&pan_name=' + encodeURIComponent(panType) + 
                                '&file_name=' + encodeURIComponent(fileName) + 
                                '&vod_title=' + encodeURIComponent(vodTitle || currentDetailTitle || '') + 
                                '&vod_id=' + vodId + 
                                '&type_id=' + typeId + 
                                '&is_tv=' + isTv + 
                                '&pic=' + encodeURIComponent(getAbsoluteCoverUrl(cover || '')) + 
                                '&fanart=' + encodeURIComponent(backdropFull) + 
                                '&from_share=1")';

            sendKodiCommand(cmdVal, '已遥控 Kodi 播放网盘文件: ' + fileName);
        }

        // Close share tree modal when clicking background
        const shareTreeModalEl = document.getElementById('shareTreeModal');
        if (shareTreeModalEl) {
            shareTreeModalEl.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeShareTreeModal();
                }
            });
        }

    </script>
    <script src="/static/kodi-remote.js"></script>
