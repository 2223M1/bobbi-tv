<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精选片单 - 巨库</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/kodi-remote.css">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        /* Ambient Orbs */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
        }

        .orb-1 {
            top: -50px;
            left: -50px;
            background: #6366F1;
        }

        .orb-2 {
            bottom: -50px;
            right: -50px;
            background: #D946EF;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            text-align: center;
        }

        .lists-title-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lists-main-title {
            font-size: 20px;
            font-weight: 800;
            color: white;
            letter-spacing: 0.5px;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
            text-align: left;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .category-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Playlists Grid (Level 1) */
        .playlists-container {
            width: 100%;
        }

        .playlists-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .playlist-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            padding: 12px;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center;
            text-decoration: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .playlist-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(99, 102, 241, 0.05);
        }

        .playlist-card:active {
            transform: scale(0.99);
        }

        .playlist-cover-wrap {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
            background: rgba(15, 23, 42, 0.6);
        }

        .playlist-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .playlist-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            text-align: left;
            flex: 1;
        }

        .playlist-title {
            font-size: 15px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-count {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Detail View (Level 2) */
        .playlist-detail-container {
            width: 100%;
            text-align: left;
        }

        .detail-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .playlist-detail-title {
            font-size: 18px;
            font-weight: 800;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .playlist-description-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .desc-tag {
            font-size: 11px;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .desc-text {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* 片单专属单列排版样式 */
        .playlist-video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            padding: 0 0 80px 0;
        }
        .playlist-video-item {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 10px;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
        }
        .playlist-video-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .playlist-video-cover-wrap {
            width: 90px;
            height: 128px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            background: rgba(15, 23, 42, 0.6);
        }
        .playlist-video-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.3s ease;
            position: relative;
            z-index: 2;
        }
        .playlist-video-cover.no-cover {
            opacity: 0;
        }
        .playlist-video-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 1;
        }
        .playlist-video-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            min-width: 0;
        }
        .playlist-video-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .playlist-video-title {
            font-size: 14px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .playlist-video-year {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .playlist-video-body-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 0;
        }
        .playlist-video-body-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .playlist-video-rating-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 12px;
        }
        .playlist-video-douban-link {
            color: #00B51D;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            transition: opacity 0.2s;
        }
        .playlist-video-douban-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        .playlist-video-score {
            font-size: 16px;
            font-weight: 800;
            color: #F59E0B;
            line-height: 1;
        }
        .playlist-video-rating-count {
            color: var(--text-muted);
            font-size: 11px;
        }
        .star-rating {
            display: inline-flex;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            align-items: center;
            gap: 1px;
        }
        .star-icon {
            position: relative;
            display: inline-block;
        }
        .star-icon.active {
            color: #F59E0B;
        }
        .star-icon.half {
            color: rgba(255, 255, 255, 0.15);
        }
        .star-icon.half::after {
            content: '★';
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            overflow: hidden;
            color: #F59E0B;
        }
        .playlist-video-tag-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .playlist-video-badge {
            width: 100px;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .playlist-video-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .playlist-video-crew-row {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Videos Grid (inside Detail View) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 380px) {
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .video-cover-wrap {
            aspect-ratio: 10/14;
            width: 100%;
            position: relative;
            background: rgba(15, 23, 42, 0.6);
        }

        .video-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .video-cover.no-cover {
            opacity: 0;
        }

        .video-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            z-index: 1;
        }

        .video-score {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(99, 102, 241, 0.95);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .video-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .video-title {
            font-size: 12px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-tag {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 9px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: calc(90px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(99, 102, 241, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.toast-error {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Bottom Nav Bar */
        .nav-bar {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px;
            right: 20px;
            width: auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        @media (min-width: 400px) {
            .nav-bar {
                left: calc(50% - 190px);
                right: auto;
                width: 380px;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            transition: all 0.3s ease;
            width: 55px;
            margin: 0;
            padding: 4px 0;
        }

        .nav-item:hover {
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: #6366F1;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            transition: stroke 0.3s ease;
        }

        .nav-item.active .nav-icon {
            stroke: #6366F1;
            filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.6));
        }

        .spinner-large {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-height: 480px) {
            .nav-bar {
                display: none;
            }
        }
    </style>
