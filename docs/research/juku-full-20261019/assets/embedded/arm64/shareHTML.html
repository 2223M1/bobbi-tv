<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享广场 - 巨库</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.cn/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/kodi-remote.css">
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; max-width: 100%; overflow-x: hidden;
            background-color: #0c0f1d;
        }
        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            padding: 20px 0 100px 0;
            position: relative;
        }
        .share-tabs-row {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px; padding: 0 16px;
        }
        .share-top-tabs {
            display: flex; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px; padding: 4px; gap: 4px;
            width: 100%; max-width: 480px;
        }
        .share-top-tab {
            flex: 1; padding: 8px 16px; font-size: 13px; font-weight: 700;
            cursor: pointer; border-radius: 10px; color: var(--text-muted);
            transition: all 0.25s ease; border: none; background: transparent; text-align: center;
        }
        .share-top-tab.active {
            background: var(--primary) !important; color: #FFFFFF !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .share-action-row { padding: 0 16px; margin-bottom: 16px; }
        .share-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 100%; }
        .share-search-bar { display: flex; align-items: center; gap: 8px; width: 100%; }
        .share-search-input {
            flex: 1; height: 38px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
            padding: 0 12px; color: white; font-size: 12px; font-weight: 600; outline: none;
        }
        .share-tool-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main); padding: 8px 12px; border-radius: 12px;
            font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; transition: all 0.2s ease;
        }
        .share-tool-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .share-tool-btn.primary {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border: none; color: white; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }
        .share-list-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 80px 16px; }
        .share-item-card {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 14px 16px; gap: 12px; cursor: pointer;
            transition: all 0.25s ease; text-align: left; min-width: 0; width: 100%; box-sizing: border-box; overflow: hidden;
        }
        .share-item-card:hover {
            transform: translateY(-2px); background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .share-item-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; overflow: hidden; }
        .share-item-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%; overflow: hidden; }
        .share-pan-badge {
            background: rgba(99, 102, 241, 0.15); color: #818cf8;
            padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
            white-space: nowrap; flex-shrink: 0;
        }
        .share-item-title { font-size: 14px; font-weight: 700; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; max-width: 100%; }
        .share-item-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
        .share-fav-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted); width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
        }
        .share-fav-btn.is-fav { color: #F59E0B; background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.25); }

        /* Modal & Toast & Nav */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .modal.active { display: flex; }
        .modal-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; width: 100%; max-width: 480px; position: relative; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); box-sizing: border-box;
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, 0.05);
            border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%;
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .toast {
            position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
        }
        .toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-error { border-color: rgba(239, 68, 68, 0.4); color: #FCA5A5; }
        .spinner-small {
            width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .spinner-large {
            width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-status { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-muted); padding: 20px 0; }

        /* Bottom Nav Bar */
        .nav-bar {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 20px;
            right: 20px;
            width: auto;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        @media (min-width: 400px) {
            .nav-bar {
                left: calc(50% - 190px);
                right: auto;
                width: 380px;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            transition: all 0.3s ease;
            width: 55px;
            margin: 0;
            padding: 4px 0;
        }

        .nav-item:hover {
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .nav-item.active {
            color: #6366F1;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            transition: stroke 0.3s ease;
        }

        .nav-item.active .nav-icon {
            stroke: #6366F1;
            filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.6));
        }

        @media (max-height: 480px) {
            .nav-bar {
                display: none;
            }
        }
        .search-input {
            height: 42px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 0 14px; color: white; font-size: 13px; outline: none;
        }
        .btn {
            height: 42px; background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            color: white; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .pan-user-file-item {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 13px; color: white; cursor: pointer; min-width: 0; width: 100%; box-sizing: border-box; overflow: hidden;
        }
        .pan-user-file-item.disabled { opacity: 0.5; cursor: default; }
        .pan-user-file-info { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .pan-user-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; max-width: 100%; }
        .pan-push-btn {
            background: var(--primary); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 1. 顶部 Tab 栏 -->
    <div class="share-tabs-row">
        <div class="share-top-tabs" id="share-top-tabs-bar">
            <button class="share-top-tab active" id="tab-share-square" onclick="switchShareTab('square')">分享广场</button>
            <button class="share-top-tab" id="tab-share-favorites" onclick="switchShareTab('favorites')">我的收藏</button>
        </div>
    </div>

    <!-- 2. 工具栏与搜索栏 -->
    <div class="share-action-row">
        <div class="share-toolbar" id="share-toolbar-default">
            <button class="share-tool-btn" onclick="toggleShareSearch(true)" title="搜索">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>搜索</span>
            </button>
            <button class="share-tool-btn" onclick="refreshShareList()" title="刷新">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                <span>刷新</span>
            </button>
            <button class="share-tool-btn primary" onclick="openAddShareModal()" title="新增分享">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>新增分享</span>
            </button>
        </div>

        <div class="share-search-bar" id="share-toolbar-search" style="display: none;">
            <input type="text" id="share-search-kw" class="share-search-input" placeholder="搜索标题或分享者..." onkeydown="if(event.key==='Enter') doShareSearch()" />
            <button class="share-tool-btn primary" onclick="doShareSearch()">搜索</button>
            <button class="share-tool-btn" onclick="toggleShareSearch(false)">取消</button>
        </div>
    </div>

    <!-- 列表容器 -->
    <div id="share-list-container" class="share-list-grid"></div>

    <div id="share-loading-status" class="loading-status" style="display: none;">
        <div class="spinner-small"></div><span>正在加载数据...</span>
    </div>
    <div id="share-empty-status" class="loading-status" style="display: none;">
        <span>暂无任何分享资源</span>
    </div>
    <div id="share-no-more-status" class="loading-status" style="display: none;">
        <span>已经到底了</span>
    </div>

    <!-- 新增分享 Modal -->
    <div class="modal" id="addShareModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeAddShareModal()">×</button>
            <div class="modal-body" style="padding: 24px; text-align: left;">
                <div style="margin-bottom: 16px; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; font-weight: 700; color: white;">发布新分享</div>
                <form id="addShareForm" onsubmit="submitNewShare(event)">
                    <div style="margin-bottom: 14px;">
                        <label style="display:block;font-size:12px;font-weight:700;color:#818cf8;margin-bottom:6px;">分享链接 <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="add-share-url" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="支持阿里/夸克/UC/百度/迅雷/123/115/移动/天翼/光鸭" required />
                    </div>
                    <div style="margin-bottom: 14px;">
                        <label style="display:block;font-size:12px;font-weight:700;color:#818cf8;margin-bottom:6px;">分享标题 <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="add-share-title" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="如：指环王 4K 60帧" required />
                    </div>
                    <div style="margin-bottom: 14px;">
                        <label style="display:block;font-size:12px;font-weight:700;color:#818cf8;margin-bottom:6px;">分享者名称 (选填)</label>
                        <input type="text" id="add-share-sharer" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="默认：匿名" />
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block;font-size:12px;font-weight:700;color:#818cf8;margin-bottom:6px;">提取码 / 密码 (选填)</label>
                        <input type="text" id="add-share-pwd" class="search-input" style="width: 100%; box-sizing: border-box;" placeholder="无密码留空" />
                    </div>
                    <button type="submit" class="btn" id="submitShareBtn" style="width:100%;">确认提交</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 分享网盘文件树 Preview Modal -->
    <div class="modal" id="shareTreeModal">
        <div class="modal-card" style="max-height: 80vh;">
            <button class="modal-close" onclick="closeShareTreeModal()">×</button>
            <div class="modal-body" style="padding: 24px; text-align: left; display: flex; flex-direction: column;">
                <div id="shareTreeModalTitle" style="margin-bottom: 4px; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white;">网盘资源文件列表</div>
                <div id="shareTreeSubTitle" style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px;"></div>
                <div id="shareTreeContent" style="flex: 1; overflow-y: auto; max-height: 55vh;"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">操作成功</div>

    <!-- Bottom Nav Bar -->
    <div class="nav-bar">
        <a href="/" class="nav-item" id="nav-home">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>推荐</span>
        </a>
        <a href="/l" class="nav-item" id="nav-lists">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>片单</span>
        </a>
        <a href="/c" class="nav-item" id="nav-category">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>分类</span>
        </a>
        <a href="/sq" class="nav-item active" id="nav-share">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            <span>广场</span>
        </a>
        <a href="/private" class="nav-item" id="nav-private">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
            <span>私有库</span>
        </a>
        <a href="/s" class="nav-item" id="nav-search">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>搜索</span>
        </a>
        <a href="/p" class="nav-item" id="nav-push">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span>推送</span>
        </a>
        <a href="/qr" class="nav-item" id="nav-pan">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <span>网盘</span>
        </a>
    </div>

    <script>
        const PROVIDER_NAMES = {
            "ALIYUN": "阿里云盘", "QUARK": "夸克网盘", "UC": "UC网盘", "BAIDU": "百度网盘",
            "XUNLEI": "迅雷云盘", "CLOUD123": "123云盘", "CLOUD115": "115网盘",
            "CHINA_MOBILE": "移动云盘", "CHINA_TELECOM": "天翼云盘", "GUANGYA": "光鸭云盘"
        };
        const CLOUD_SHARE_PREFIXES = {
            "ALIYUN": "https://www.alipan.com/s/", "QUARK": "https://pan.quark.cn/s/",
            "UC": "https://drive.uc.cn/s/", "BAIDU": "https://pan.baidu.com/s/",
            "XUNLEI": "https://pan.xunlei.com/s/", "CLOUD123": "https://www.123pan.com/s/",
            "CLOUD115": "https://115.com/s/", "CHINA_MOBILE": "https://yun.139.com/shareweb/#/w/i/",
            "CHINA_TELECOM": "https://cloud.189.cn/web/share?code=", "GUANGYA": "https://www.guangyapan.com/s/"
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.toggle('toast-error', isError);
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        let sharePage = 1, shareTotalPages = 1, isShareLoading = false;
        let currentShareMode = 'square', currentShareKeyword = '';

        function switchShareTab(mode) {
            if (currentShareMode === mode) return;
            currentShareMode = mode;
            document.getElementById('tab-share-square').classList.toggle('active', mode === 'square');
            document.getElementById('tab-share-favorites').classList.toggle('active', mode === 'favorites');
            toggleShareSearch(false);
            loadShares(true);
        }

        function toggleShareSearch(open) {
            const defaultToolbar = document.getElementById('share-toolbar-default');
            const searchBar = document.getElementById('share-toolbar-search');
            const input = document.getElementById('share-search-kw');
            if (open) {
                defaultToolbar.style.display = 'none'; searchBar.style.display = 'flex'; input.focus();
            } else {
                defaultToolbar.style.display = 'flex'; searchBar.style.display = 'none'; input.value = '';
                if (currentShareKeyword) { currentShareKeyword = ''; loadShares(true); }
            }
        }

        function doShareSearch() {
            currentShareKeyword = document.getElementById('share-search-kw').value.trim();
            loadShares(true);
        }
        function refreshShareList() { loadShares(true); }

        async function loadShares(reset = true) {
            if (isShareLoading) return;
            isShareLoading = true;
            const container = document.getElementById('share-list-container');
            const loader = document.getElementById('share-loading-status');
            const emptyEl = document.getElementById('share-empty-status');
            const noMoreEl = document.getElementById('share-no-more-status');
            if (reset) { sharePage = 1; container.innerHTML = ''; emptyEl.style.display = 'none'; noMoreEl.style.display = 'none'; }
            loader.style.display = 'flex';
            try {
                const endpoint = currentShareMode === 'favorites' ? '/api/mv/shares/favorites' : '/api/mv/shares';
                let queryUrl = endpoint + '?page=' + sharePage + '&pageSize=100';
                if (currentShareMode === 'square' && currentShareKeyword) queryUrl += '&keyword=' + encodeURIComponent(currentShareKeyword);

                const res = await fetch(queryUrl);
                if (!res.ok) throw new Error("HTTP " + res.status);
                const raw = await res.json();
                const data = raw.data || {}, list = data.list || [], total = data.total || 0, pageSize = data.pageSize || 100;
                shareTotalPages = Math.ceil(total / pageSize) || 1;

                if (reset && list.length === 0) {
                    loader.style.display = 'none'; emptyEl.style.display = 'flex'; isShareLoading = false; return;
                }
                let html = '';
                list.forEach(item => {
                    const panLabel = PROVIDER_NAMES[item.panType] || item.panType;
                    const dateStr = (item.createdAt || '').substring(0, 10);
                    const sharerStr = item.sharer || '匿名';
                    const isFav = !!item.isFavorited;
                    html += 
                        '<div class="share-item-card" onclick="openShareTreeModal(' + item.id + ', \'' + escapeJsString(item.url) + '\', \'' + escapeJsString(item.title) + '\', \'' + item.panType + '\', \'' + escapeJsString(item.pwd || '') + '\')">' +
                            '<div class="share-item-left">' +
                                '<div class="share-item-title-row">' +
                                    '<span class="share-pan-badge">' + panLabel + '</span>' +
                                    '<span class="share-item-title">' + escapeHtml(item.title) + '</span>' +
                                '</div>' +
                                '<div class="share-item-meta">' +
                                    '<span>👤 ' + escapeHtml(sharerStr) + '</span><span>📅 ' + dateStr + '</span>' +
                                '</div>' +
                            '</div>' +
                            '<button class="share-fav-btn ' + (isFav ? 'is-fav' : '') + '" onclick="toggleFavoriteShare(event, ' + item.id + ', ' + isFav + ')">' + (isFav ? '★' : '☆') + '</button>' +
                        '</div>';
                });
                container.innerHTML += html;
                loader.style.display = 'none';
                if (sharePage >= shareTotalPages) noMoreEl.style.display = 'flex';
            } catch (err) {
                showToast("加载失败: " + err.message, true); loader.style.display = 'none';
            } finally { isShareLoading = false; }
        }

        async function toggleFavoriteShare(e, shareId, isFav) {
            e.stopPropagation();
            try {
                const method = isFav ? 'DELETE' : 'POST';
                const res = await fetch('/api/mv/shares/' + shareId + '/favorite', { method });
                if (res.ok) { showToast(isFav ? '已取消收藏' : '收藏成功'); loadShares(true); }
                else { const err = await res.json().catch(() => ({})); showToast('操作失败: ' + (err.error || '未知错误'), true); }
            } catch (err) { showToast('操作失败: ' + err.message, true); }
        }

        function openAddShareModal() {
            document.getElementById('add-share-url').value = ''; document.getElementById('add-share-title').value = '';
            document.getElementById('add-share-sharer').value = ''; document.getElementById('add-share-pwd').value = '';
            document.getElementById('addShareModal').classList.add('active');
        }
        function closeAddShareModal() { document.getElementById('addShareModal').classList.remove('active'); }

        async function submitNewShare(e) {
            e.preventDefault();
            const btn = document.getElementById('submitShareBtn');
            btn.disabled = true; btn.innerText = '提交中...';
            const payload = {
                url: document.getElementById('add-share-url').value.trim(),
                title: document.getElementById('add-share-title').value.trim(),
                sharer: document.getElementById('add-share-sharer').value.trim() || '匿名',
                pwd: document.getElementById('add-share-pwd').value.trim() || undefined
            };
            try {
                const res = await fetch('/api/mv/shares', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json().catch(() => ({}));
                if (res.status === 409 || data.code === 'SHARE_EXISTS') { showToast('提示：' + (data.error || '该分享链接已存在'), true); }
                else if (res.ok && data.code === 'SUCCESS') { showToast('发布分享成功！'); closeAddShareModal(); loadShares(true); }
                else { showToast('发布失败: ' + (data.error || '未知错误'), true); }
            } catch (err) { showToast('提交失败: ' + err.message, true); }
            finally { btn.disabled = false; btn.innerText = '确认提交'; }
        }

        let currentShareTreeContext = {
            shareId: 0,
            url: '',
            pwd: '',
            panType: '',
            vodTitle: '',
            breadcrumbs: []
        };

        let shareTreeState = {
            page: 1,
            pageSize: 50,
            hasMore: true,
            loading: false,
            armed: true,
            currentParentId: ''
        };

        function openShareTreeModal(shareId, url, title, panType, pwd) {
            const modal = document.getElementById('shareTreeModal');
            document.getElementById('shareTreeModalTitle').innerText = title;
            
            currentShareTreeContext = {
                shareId: shareId,
                url: url,
                pwd: pwd,
                panType: panType,
                vodTitle: title,
                breadcrumbs: [{ id: '', name: '根目录' }]
            };

            const content = document.getElementById('shareTreeContent');
            content.onscroll = () => {
                if (!shareTreeState.hasMore || shareTreeState.loading) return;
                const distanceToBottom = content.scrollHeight - (content.scrollTop + content.clientHeight);
                if (distanceToBottom > 200) {
                    shareTreeState.armed = true;
                }
                if (distanceToBottom <= 50 && shareTreeState.armed) {
                    shareTreeState.armed = false;
                    loadShareFiles(shareTreeState.currentParentId, true);
                }
            };

            modal.classList.add('active');
            renderShareBreadcrumbs();
            loadShareFiles('');
        }
        function closeShareTreeModal() { document.getElementById('shareTreeModal').classList.remove('active'); }

        function renderShareBreadcrumbs() {
            const subTitle = document.getElementById('shareTreeSubTitle');
            const { panType, url, breadcrumbs } = currentShareTreeContext;
            const panName = PROVIDER_NAMES[panType] || panType;

            let html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;">';
            html += '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-muted);">';
            html += '<span>' + panName + '</span>';

            breadcrumbs.forEach((b, idx) => {
                if (idx === breadcrumbs.length - 1) {
                    html += ' <span style="color:white;font-weight:700;">/ ' + escapeHtml(b.name) + '</span>';
                } else {
                    html += ' <span style="cursor:pointer;color:#818cf8;text-decoration:underline;" onclick="navToShareBreadcrumb(' + idx + ')">/ ' + escapeHtml(b.name) + '</span>';
                }
            });
            html += '</div>';

            if (breadcrumbs.length > 1) {
                html += '<button class="share-tool-btn" style="padding:2px 8px;font-size:11px;flex-shrink:0;" onclick="navBackShareFolder()">⬅️ 返回</button>';
            }
            html += '</div>';
            subTitle.innerHTML = html;
        }

        function enterShareFolder(fileId, folderName) {
            currentShareTreeContext.breadcrumbs.push({ id: fileId, name: folderName });
            renderShareBreadcrumbs();
            loadShareFiles(fileId);
        }

        function navBackShareFolder() {
            if (currentShareTreeContext.breadcrumbs.length > 1) {
                currentShareTreeContext.breadcrumbs.pop();
                renderShareBreadcrumbs();
                const last = currentShareTreeContext.breadcrumbs[currentShareTreeContext.breadcrumbs.length - 1];
                loadShareFiles(last.id);
            }
        }

        function navToShareBreadcrumb(index) {
            if (index >= 0 && index < currentShareTreeContext.breadcrumbs.length) {
                currentShareTreeContext.breadcrumbs = currentShareTreeContext.breadcrumbs.slice(0, index + 1);
                renderShareBreadcrumbs();
                const target = currentShareTreeContext.breadcrumbs[currentShareTreeContext.breadcrumbs.length - 1];
                loadShareFiles(target.id);
            }
        }

        function toShareUrl(rawUrl, panName) {
            if (!rawUrl) return "";
            rawUrl = rawUrl.trim();
            if (rawUrl.startsWith("http://") || rawUrl.startsWith("https://")) return rawUrl;
            const prefix = CLOUD_SHARE_PREFIXES[panName];
            if (prefix) return prefix + rawUrl;
            return rawUrl;
        }

        async function loadShareFiles(parentFileId = '', append = false) {
            if (shareTreeState.loading) return;

            const content = document.getElementById('shareTreeContent');
            
            if (!append) {
                shareTreeState.loading = true;
                shareTreeState.page = 1;
                shareTreeState.hasMore = true;
                shareTreeState.armed = true;
                shareTreeState.currentParentId = parentFileId;
                content.scrollTop = 0;
                content.innerHTML = '<div class="spinner-large"></div><div style="text-align:center;color:var(--text-muted);font-size:12px;">正在调取网盘驱动加载目录...</div>';
            } else {
                if (!shareTreeState.hasMore) return;
                shareTreeState.loading = true;
                shareTreeState.page += 1;
                let existingLoader = document.getElementById('shareTreeBottomLoader');
                if (!existingLoader) {
                    const loaderDiv = document.createElement('div');
                    loaderDiv.id = 'shareTreeBottomLoader';
                    loaderDiv.style.cssText = 'text-align:center;padding:12px;color:var(--text-muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;';
                    loaderDiv.innerHTML = '<div class="spinner-small"></div> 正在加载下一页...';
                    content.appendChild(loaderDiv);
                }
            }

            const { url, pwd, panType, vodTitle } = currentShareTreeContext;
            try {
                const fullUrl = toShareUrl(url, panType);
                const queryUrl = '/api/list?share_url=' + encodeURIComponent(fullUrl) + 
                                '&code=' + encodeURIComponent(pwd || '') + 
                                '&parent_file_id=' + encodeURIComponent(parentFileId || '') + 
                                '&flat=0' +
                                '&page=' + shareTreeState.page +
                                '&page_size=' + shareTreeState.pageSize;

                const res = await fetch(queryUrl);
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || ("HTTP " + res.status));
                }
                const data = await res.json();
                const files = data.files || [];

                if (typeof data.has_more === 'boolean') {
                    shareTreeState.hasMore = data.has_more;
                } else {
                    shareTreeState.hasMore = files.length >= shareTreeState.pageSize;
                }

                let bottomLoader = document.getElementById('shareTreeBottomLoader');
                if (bottomLoader) {
                    bottomLoader.remove();
                }

                if (!append && files.length === 0) {
                    content.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px 0;">此目录下暂无可播放文件或子文件夹</div>';
                    return;
                }

                let itemsHtml = '';
                files.forEach(f => {
                    const fName = f.file_name || '未命名文件', fSize = f.size_label || '';
                    const isMedia = !f.is_folder && isMediaFile(fName);
                    if (f.is_folder) {
                        itemsHtml += '<div class="pan-user-file-item" onclick="enterShareFolder(\'' + escapeJsString(f.file_id || '') + '\', \'' + escapeJsString(fName) + '\')"><div class="pan-user-file-info"><span>📁</span><span class="pan-user-file-name" style="font-weight:700;color:white;">' + escapeHtml(fName) + '</span></div><span style="font-size:13px;color:var(--text-muted);">&gt;</span></div>';
                    } else if (isMedia) {
                        itemsHtml += '<div class="pan-user-file-item" onclick="pushShareFile(\'' + escapeJsString(f.file_id || '') + '\', \'' + escapeJsString(fName) + '\')"><div class="pan-user-file-info"><span>🎬</span><span class="pan-user-file-name">' + escapeHtml(fName) + '</span></div><div><span style="font-size:11px;color:var(--text-muted);">' + fSize + '</span></div></div>';
                    } else {
                        itemsHtml += '<div class="pan-user-file-item disabled"><div class="pan-user-file-info"><span>📄</span><span class="pan-user-file-name" style="color:var(--text-muted);">' + escapeHtml(fName) + '</span></div><div style="font-size:11px;color:var(--text-muted);">' + fSize + '</div></div>';
                    }
                });

                if (!append) {
                    let html = '<div class="pan-user-file-list" id="shareTreeList">' + itemsHtml + '</div>';
                    if (shareTreeState.hasMore) {
                        html += '<div id="shareTreeEndHint" style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">下拉滚动加载更多...</div>';
                    } else if (files.length > 0) {
                        html += '<div id="shareTreeEndHint" style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px;">已加载全部内容</div>';
                    }
                    content.innerHTML = html;
                } else {
                    const listContainer = document.getElementById('shareTreeList');
                    if (listContainer) {
                        listContainer.insertAdjacentHTML('beforeend', itemsHtml);
                    }
                    const endHint = document.getElementById('shareTreeEndHint');
                    if (endHint) {
                        if (shareTreeState.hasMore) {
                            endHint.innerText = '下拉滚动加载更多...';
                        } else {
                            endHint.innerText = '已加载全部内容';
                        }
                    }
                }
            } catch (err) {
                if (!append) {
                    content.innerHTML = '<div style="text-align:center;color:#FCA5A5;padding:30px 0;">获取失败: ' + escapeHtml(err.message) + '</div>';
                } else {
                    showToast('加载下一页失败: ' + err.message, true);
                }
            } finally {
                shareTreeState.loading = false;
            }
        }

        function pushShareFile(fileId, fileName) {
            const { url, pwd, panType, vodTitle } = currentShareTreeContext;
            const playCmd = 'PlayMedia("plugin://plugin.video.juku/?action=pan_play&url=' + encodeURIComponent(url) + '&code=' + encodeURIComponent(pwd || '') + '&file_id=' + encodeURIComponent(fileId || '') + '&pan_name=' + encodeURIComponent(panType) + '&file_name=' + encodeURIComponent(fileName) + '&vod_title=' + encodeURIComponent(vodTitle) + '&from_share=1")';
            pushPlayCmd(playCmd, fileName);
        }

        async function pushPlayCmd(cmd, fileName) {
            try {
                const res = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: cmd, title: "播放网盘文件" }) });
                if (res.ok) showToast("已推送至 Kodi 播放: " + fileName);
                else showToast("推送失败", true);
            } catch (err) { showToast("推送失败: " + err.message, true); }
        }

        function isMediaFile(name) {
            if (!name) return false;
            const ext = name.split('.').pop().toLowerCase();
            return ['mp4', 'mkv', 'avi', 'mov', 'wmv', 'flv', 'm3u8', 'ts', 'iso', 'mp3', 'flac', 'm4a', 'aac'].includes(ext);
        }

        function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function escapeJsString(str) { return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

        window.addEventListener('scroll', () => {
            if (isShareLoading || sharePage >= shareTotalPages) return;
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
                sharePage++; loadShares(false);
            }
        });

        window.onload = () => loadShares(true);
    </script>
    <script src="/static/kodi-remote.js"></script>
</body>
</html>
