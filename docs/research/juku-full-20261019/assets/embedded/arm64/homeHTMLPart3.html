    <script>
        let isLoading = false;

        // Show Toast Function
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.toggle('toast-error', isError);
            toast.classList.add('active');
            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        let allRecommendVideos = [];
        let currentRecommendType = 'movie';

        function renderRecommendVideos() {
            const content = document.getElementById('videosContent');
            if (allRecommendVideos.length === 0) {
                content.innerHTML = '<div class="msg-box">暂无热门影片推荐，请稍后再试<\/div>';
                return;
            }

            let filtered = allRecommendVideos;
            if (currentRecommendType === 'movie') {
                filtered = allRecommendVideos.filter(v => {
                    const typeId = v.typeId || v.type_id || 1;
                    return typeId === 1;
                });
            } else if (currentRecommendType === 'tv') {
                filtered = allRecommendVideos.filter(v => {
                    const typeId = v.typeId || v.type_id || 1;
                    return typeId === 2;
                });
            }

            if (filtered.length === 0) {
                content.innerHTML = '<div class="msg-box">该分类下暂无推荐影片<\/div>';
                return;
            }

            let gridHTML = '<div class="video-grid" id="videoGrid">';
            filtered.forEach(v => {
                const cover = v.pic || v.coverUrl || v.sourceCoverUrl || '';
                const year = v.year || '未知';
                const label = v.typeName || '';
                
                const ratingVal = v.rating ? parseFloat(v.rating) : (v.score ? parseFloat(v.score) : 0);
                const ratingHTML = ratingVal > 0 ? ('<div class="video-score">' + ratingVal.toFixed(1) + '<\/div>') : '';

                gridHTML += 
                    '<div class="video-card" onclick="openDetail(' + v.id + ')">' +
                        '<div class="video-cover-wrap">' +
                            '<img class="video-cover" referrerpolicy="no-referrer" src="' + getAbsoluteCoverUrl(cover) + '" alt="' + v.title + '" onerror="this.classList.add(\'no-cover\')">' +
                            '<div class="video-cover-placeholder">无封面<\/div>' +
                            ratingHTML +
                        '<\/div>' +
                        '<div class="video-info">' +
                            '<div class="video-title">' + v.title + '<\/div>' +
                            '<div class="video-meta">' +
                                '<span>' + year + '<\/span>' +
                                (label ? '<span class="video-tag">' + label + '<\/span>' : '') +
                            '<\/div>' +
                        '<\/div>' +
                    '<\/div>';
            });
            gridHTML += '<\/div>';
            content.innerHTML = gridHTML;
        }

        function switchRecommendType(type) {
            currentRecommendType = type;
            const tabs = document.querySelectorAll('.recommend-tab');
            tabs.forEach(t => {
                t.classList.toggle('active', t.getAttribute('data-type') === type);
            });
            renderRecommendVideos();
        }

        // Fetch recommend videos list
        async function loadRecommendVideos() {
            if (isLoading) return;
            isLoading = true;

            const content = document.getElementById('videosContent');
            content.innerHTML = '<div class="spinner-large"><\/div>';

            try {
                const response = await fetch('/api/mv/videos/recommend');
                if (!response.ok) throw new Error("HTTP " + response.status);
                const raw = await response.json();
                
                allRecommendVideos = raw.data || raw.items || (Array.isArray(raw) ? raw : []);
                renderRecommendVideos();

            } catch (err) {
                console.error(err);
                content.innerHTML = '<div class="msg-box" style="color:var(--color-expired);">加载推荐影片失败: ' + err.message + '<\/div>';
            } finally {
                isLoading = false;
            }
        }

        // Run on startup
        window.addEventListener('DOMContentLoaded', () => {
            loadRecommendVideos();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
